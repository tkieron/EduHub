/* v1.4 — dyktowanie odpowiedzi opisowych */
.voice-input { position:relative }
.voice-input .essay { display:block; padding-right:72px; min-height:190px }
.voice-mic { position:absolute; right:12px; top:12px; display:flex; justify-content:center; align-items:center; width:49px; height:49px; border-radius:15px; border:2px solid #b8d7c1; color:#256b49; background:#eaf7ec; box-shadow:0 3px 9px #245b4020; transition:background .15s ease }
.voice-mic:hover:not(:disabled) { background:#dcf4e1 }
.voice-mic svg { width:23px; height:23px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round }
.voice-mic.listening { background:#ffe8e7; color:#a6282d; border-color:#ed9492; animation:voicePulse 1.2s ease-in-out infinite }
.voice-mic:disabled { opacity:.38 }
.voice-status { min-height:23px; margin-top:9px; color:#567362; font-size:13px; line-height:1.4 }
.voice-status.error { color:#aa3337 }
@keyframes voicePulse { 50% { box-shadow:0 0 0 7px #e8626230 } }
@media (prefers-reduced-motion:reduce) { .voice-mic.listening { animation:none } }
@media print { .voice-mic, .voice-status { display:none!important } }

/* v1.5: samodzielna diagnostyka mikrofonu, dyktowania i syntezy mowy */
.diag-status { border-radius:12px; padding:12px 14px; background:#eff5ed; color:#355b43; margin:10px 0; min-height:49px; overflow-wrap:anywhere; white-space:pre-wrap }
.diag-status.warn { background:#fff6e6; color:#8a5117 }
.diag-status.fail { background:#fff0ed; color:#962e28 }
.diag-status.ok { background:#eaf8ed; color:#1d6840 }
.diag-actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:13px 0 }
.diag-details { background:#f5f7f4; border:1px solid #e5ede4; border-radius:12px; padding:15px; white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; color:#394c42 }
.diag-check { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px }
.diag-check > div { background:#f7f9f5; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:13px }
.diag-check strong { display:block; margin-bottom:5px }
@media(max-width:550px){ .diag-check{grid-template-columns:1fr} .diag-actions .button{flex:1 1 170px} }
@media print { .diag-screen { display:none!important } }

rzez człowieka.","type":"open","model":"Naturalne: np. rzeka, skała, drzewo; antropogeniczne: np. budynek, droga, most.","criteria":"Punkty za poprawne przypisanie co najmniej dwóch przykładów do obu grup; bez uznawania rzeczy sztucznych za naturalne.","explain":"Naturalne: np. rzeka, skała, drzewo; antropogeniczne: np. budynek, droga, most."},{"id":"P026","cat":"P","level":"R","page":11,"q":"Wymień trzy czynności życiowe organizmów i wyjaśnij jedną z nich.","type":"open","model":"Przykładowo: oddychanie, odżywianie się, rozmnażanie się. Oddychanie umożliwia organizmom pozyskiwanie energii z substancji pokarmowych.","criteria":"Punkty za trzy poprawne czynności życiowe i sensowne krótkie wyjaśnienie jednej z nich.","explain":"Przykładowo: oddychanie, odżywianie się, rozmnażanie się. Oddychanie umożliwia organizmom pozyskiwanie energii z substancji pokarmowych."},{"id":"Z027","cat":"Z","level":"W","page":16,"q":"Co nazywamy bodźcem?","type":"single","options":["Zmianę lub informację odbieraną przez organizm z pomocą receptorów","Wyłącznie dźwięk","Każdy przedmiot z plastiku","Nazwę organu wzroku"],"answer":0,"explain":"Bodziec to informacja docierająca ze środowiska, np. światło, dźwięk, zapach czy nacisk."},{"id":"Z028","cat":"Z","level":"W","page":16,"q":"Gdzie znajdują się receptory odbierające światło?","type":"single","options":["W żołądku","W języku","W kościach","W oczach"],"answer":3,"explain":"Receptory światła znajdują się w narządzie wzroku – oczach."},{"id":"Z029","cat":"Z","level":"W","page":16,"q":"Dopasuj narząd do zmysłu.","type":"match","pairs":[["Oko","Wzrok"],["Ucho","Słuch"],["Język","Smak"],["Nos","Węch"],["Skóra","Dotyk"]],"explain":"Narządy i zmysły tworzą pary: oko–wzrok, ucho–słuch, język–smak, nos–węch, skóra–dotyk."},{"id":"Z030","cat":"Z","level":"W","page":17,"q":"Który zmysł pomaga rozpoznawać odgłosy ptaków?","type":"single","options":["Węch","Smak","Dotyk","Słuch"],"answer":3,"explain":"Dźwięki odbieramy za pomocą słuchu."},{"id":"Z031  z dala od metalu lub magnesów. Czekam, aż igła się zatrzyma. Jej oznaczony koniec wskazuje północ; ustawiam N tarczy w tym kierunku.","criteria":"Punkty za: pozycja pozioma i brak zakłóceń, odczekanie na ustabilizowanie wskazówki, rozpoznanie oznaczonego końca i kierunku N.","explain":"Trzymam kompas poziomo i z dala od metalu lub magnesów. Czekam, aż igła się zatrzyma. Jej oznaczony koniec wskazuje północ; ustawiam N tarczy w tym kierunku."},{"id":"K088","cat":"K","level":"R","page":28,"q":"Wyjaśnij, co oznacza zorientowanie mapy w terenie.","type":"open","model":"Obracamy mapę tak, aby kierunek północy na mapie pokrywał się z północą w rzeczywistości i aby punkty terenowe odpowiadały obiektom na mapie.","criteria":"Punkty za: dopasowanie kierunków świata mapy do rzeczywistości; możliwość wykorzystania kompasu lub charakterystycznych obiektów.","explain":"Obracamy mapę tak, aby kierunek północy na mapie pokrywał się z północą w rzeczywistości i aby punkty terenowe odpowiadały obiektom na mapie."},{"id":"K089","cat":"K","level":"R","page":27,"q":"Wymień cztery elementy mapy i wyjaśnij, do czego służy jeden z nich.","type":"open","model":"Tytuł, legenda, skala, treść mapy. Np. legenda objaśnia znaki, a skala pokazuje pomniejszenie odległości.","criteria":"Punkty za cztery poprawne elementy i trafną funkcję co najmniej jednego.","explain":"Tytuł, legenda, skala, treść mapy. Np. legenda objaśnia znaki, a skala pokazuje pomniejszenie odległości."},{"id":"D090","cat":"D","level":"W","page":34,"q":"Czym jest obserwacja przyrodnicza?","type":"single","options":["Zapamiętywaniem bez sprawdzania","Zawsze mieszaniem chemikaliów","Budowaniem przyrządów","Uważnym przyglądaniem się i zbieraniem informacji bez celowej zmiany warunków"],"answer":3,"explain":"Podczas obserwacji śledzimy obiekt lub zjawisko, nie ingerując celowo w warunki."},{"id":"D091","cat":"D","level":"W","page":34,"q":"Czym jest doświadczenie przyrodnicze?","type":"single","options":["Zgadywaniem odpowiedzi","Każdym oglądaniem obrazu","Wyłącznie spacerem po parku","Badaniem, w którym celowo zmieniamy wybrany czynnik i obserwujemy jego wpływ"],"answer":3,"explain":"W doświadczeniu sprawdzamy, jak zmiana warunków wpływa na badane zjawisko."},{"id":"D092","cat":"D","level":"R","page":34,"q":"Dziecko codziennie notuje godzinę wschodu Słońca, niczego nie zmieniając. To…","type":"single","options":["Orientacja mapy","Obserwacja","Doświadczenie z próbą badawczą","Budowanie mikroskopu"],"answer":1,"explain":"Notowanie zmian bez ingerencji w warunki jest obserwacją."},{"id":"D093","cat":"D","level":"R","page":34,"q":"Uczeń podlewa jedną roślinę, a drugiej nie, by sprawdzić wpływ wody. To…","type":"single","options":["Doświadczenie","Wyłącznie obserwacja","Pomiar kierunków","Złudzenie optyczne"],"answer":0,"explain":"Uczeń celowo zmienia ilość dostarczanej wody, więc prowadzi doświadczenie."},{"id":"D094","cat":"D","level":"W","page":35,"q":"Jak nazywa się pytanie, na które chcemy znaleźć odpowiedź podczas doświadczenia?","type":"single","options":["Wnioskiem","Pytaniem badawczym","Wynikiem","Legendą mapy"],"answer":1,"explain":"Pytanie badawcze określa, czego chcemy się dowiedzieć."},{"id":"D095","cat":"D","level":"W","page":35,"q":"Czym jest hipoteza?","type":"single","options":["Przewidywaną odpowiedzią na pytanie badawcze","Podsumowaniem po badaniu","Zawsze potwierdzonym faktem","Listą przyrządów"],"answer":0,"explain":"Hipoteza jest przypuszczalną odpowiedzią, którą weryfikuje doświadczenie."},{"id":"D096","cat":"D","level":"R","page":35,"q":"Pytanie: „Czy ciepła woda przyspiesza rozpuszczanie cukru?”. Która hipoteza jest odpowiednia?","type":"single","options":["Cukier rozpuści się szybciej w ciepłej wodzie","Zapisujemy temperaturę","Należy nalać wodę do szklanki","Będziemy używać łyżeczki"],"answer":0,"explain":"Hipoteza to przewidywany wynik, np. szybsze rozpuszczanie cukru w ciepłej wodzie."},{"id":"D097","cat":"D","level":"W","page":35,"q":"Jak nazywamy zestaw, w którym nie wprowadzamy badanego czynnika?","type":"single","options":["Wnioskiem","Przyrządem","Próbą kontrolną","Próbą badawczą"],"answer":2,"explain":"Próba kontrolna stanowi punkt odniesienia dla próby badawczej."},{"id":"D098","cat":"D","level":"W","page":35,"q":"Jak nazywamy zestaw, w którym zmieniamy badany czynnik?","type":"single","options":["Notatką","Próbą badawczą","Próbą kontrolną","Legendą"],"answer":1,"explain":"Próba badawcza różni się od kontrolnej badanym czynnikiem."},{"id":"D099","cat":"D","level":"R","page":35,"q":"W doświadczeniu z cukrem szklanka ma 20°C, a druga 70°C. Co jest celowo zmienianym czynnikiem?","type":"single","options":["Masa łyżeczki","Rodzaj szklanki (jeśli jest taki sam)","Temperatura wody","Ilość cukru (jeśli jest równa)"],"answer":2,"explain":"Zmienia się temperatura wody, a pozostałe warunki powinny być takie same."},{"id":"D100","cat":"D","level":"R","page":35,"q":"Dlaczego w dobrym doświadczeniu zmieniamy tylko jeden badany czynnik?","type":"single","options":["Żeby zawsze uzyskać oczekiwany wynik","Żeby nie zapisywać pomiarów","Żeby doświadczenie nie miało kontroli","Żeby wiedzieć, co wywołało obserwowany efekt"],"answer":3,"explain":"Gdy zmienia się jeden czynnik, łatwiej ustalić przyczynę zaobserwowanej różnicy."},{"id":"D101","cat":"D","level":"W","page":36,"q":"Które naczynia lub przyrządy mogą być używane do doświadczeń?","type":"multi","options":["Zlewka","Kolba","Kompas do wyznaczania temperatury","Probówka","Cylinder miarowy"],"answer":[0,1,3,4],"explain":"Zlewki, probówki, kolby i cylindry miarowe są typowym wyposażeniem do doświadczeń."},{"id":"D102","cat":"D","level":"W","page":36,"q":"Który przyrząd służy do odmierzania objętości cieczy?","type":"single","options":["Cylinder miarowy","Mikroskop","Lornetka","Kompas"],"answer":0,"explain":"Cylinder miarowy ma podziałkę do odczytu objętości."},{"id":"D103","cat":"D","level":"W","page":36,"q":"Do czego przydaje się szalka?","type":"single","options":["Do słuchania dźwięku","Do oglądania gwiazd","Do umieszczania niewielkiej ilości materiału","Do wyznaczania północy"],"answer":2,"explain":"Na szalce można położyć badany przedmiot lub niewielką ilość materiału."},{"id":"D104","cat":"D","level":"R","page":36,"q":"Dlaczego doświadczenia należy przeprowadzać w bezpiecznych warunkach?","type":"single","options":["Bo wynik zawsze jest fałszywy","Bo niektóre substancje, temperatury i przedmioty mogą być niebezpieczne","Bo doświadczeń nigdy się nie powtarza","Bo nie potrzeba instrukcji"],"answer":1,"explain":"Należy przestrzegać instrukcji, używać bezpiecznych materiałów i zachować ostrożność."},{"id":"D105","cat":"D","level":"W","page":35,"q":"Ułóż główne etapy doświadczenia przyrodniczego.","type":"order","steps":["Sformułowanie pytania badawczego","Postawienie hipotezy","Zaplanowanie doświadczenia","Wykonanie prób i obserwacja","Sformułowanie wniosków"],"explain":"Najpierw pytamy i przewidujemy, następnie planujemy, badamy i wyciągamy wnioski."},{"id":"D106","cat":"D","level":"W","page":37,"q":"Który zapis NIE jest sposobem dokumentowania wyników?","type":"single","options":["Zdjęcie","Tabela","Zapomnienie wyników","Wykres"],"answer":2,"explain":"Wyniki można zapisać w tabeli, na wykresie, rysunku lub zdjęciu."},{"id":"D107","cat":"D","level":"W","page":37,"q":"Jak można dokumentować wyniki doświadczenia?","type":"multi","options":["Rysunkiem","Wykresem","Fotografią","Wyłącznie z pamięci","Tabelą"],"answer":[0,1,2,4],"explain":"Wyniki dokumentujemy, żeby móc je porównywać i analizować."},{"id":"D108","cat":"D","level":"R","page":37,"q":"Woda ciepła rozpuściła cukier szybciej niż zimna. Jaki wniosek najlepiej pasuje do wyniku?","type":"single","options":["Cukier nie rozpuszcza się w wodzie","Temperatura nie ma żadnego znaczenia","Wyższa temperatura przyspieszyła rozpuszczanie cukru w tym doświadczeniu","Zimna woda zawsze wrze"],"answer":2,"explain":"Wniosek musi wynikać z obserwacji, a nie z życzenia badacza."},{"id":"D109","cat":"D","level":"R","page":38,"q":"Która wypowiedź jest hipotezą?","type":"single","options":["„Zrobiłem fotografię”","„Wyższa temperatura może przyspieszać wydzielanie gazu”","„Obserwowałem 20 minut”","„Do butelki wsypałem cukier”"],"answer":1,"explain":"Hipoteza jest przewidywaniem możliwego wyniku."},{"id":"D110","cat":"D","level":"R","page":38,"q":"Która wypowiedź najlepiej opisuje próbę kontrolną?","type":"single","options":["Zestaw bez celowo zmienionego czynnika","Zestaw z wieloma dodatkowymi zmianami","Zestaw bez żadnych wyników","Zestaw, którego się nie obserwuje"],"answer":0,"explain":"Próba kontrolna służy do porównania z próbą badawczą."},{"id":"D111","cat":"D","level":"R","page":39,"q":"Próby różnią się ilością nawozu. Czego nie należy zmieniać jednocześnie?","type":"single","options":["Rodzaju rośliny i ilości wody","Wyłącznie opisu wykresu","Wyłącznie nazwy próby","Godziny zapisania wniosku"],"answer":0,"explain":"Inne warunki powinny być jak najbardziej jednakowe, aby móc ocenić wpływ nawozu."},{"id":"D112","cat":"D","level":"R","page":39,"q":"Dlaczego naukowcy powtarzają doświadczenia?","type":"single","options":["Aby usunąć wszystkie złe wyniki bez wyjaśnienia","Aby sprawdzić, czy otrzymują podobne, wiarygodne wyniki","Aby nie wykonywać pomiarów","Aby zawsze potwierdzić hipotezę"],"answer":1,"explain":"Powtarzanie pomaga ocenić wiarygodność i przypadkowe odchylenia wyników."},{"id":"D113","cat":"D","level":"R","page":40,"q":"Jeśli wyniki nie potwierdziły hipotezy, należy…","type":"single","options":["Wpisać oczekiwany wynik","Ukryć pomiary","Rzetelnie zapisać wyniki i odpowiednio zmienić wniosek","Uznać, że doświadczenie się nie odbyło"],"answer":2,"explain":"Niepotwierdzona hipoteza nadal daje wiedzę; liczą się rzeczywiste wyniki."},{"id":"D114","cat":"D","level":"R","page":40,"q":"Dlaczego porównanie próby kontrolnej i badawczej jest ważne?","type":"single","options":["Dzięki temu nie trzeba obserwować","Pomaga wyznaczyć zachód","Zawsze daje wynik 100%","Pozwala wskazać wpływ zmienionego czynnika"],"answer":3,"explain":"Porównujemy próby, aby ocenić wpływ badanego czynnika."},{"id":"D115","cat":"D","level":"R","page":41,"q":"Wybierz dobre zasady doświadczeń.","type":"multi","options":["Dbaj o porównywalne warunki prób","Nie poprawiaj wyniku na oczekiwany","Zmieniaj naraz jak najwięcej czynników","Zapisuj obserwacje","Wyciągaj wnioski na podstawie wyników"],"answer":[0,1,3,4],"explain":"Dobre badanie wymaga uczciwego notowania i kontrolowania zmiennych."},{"id":"D116","cat":"D","level":"R","page":40,"q":"Badamy wpływ światła na wzrost roślin. Co powinno być takie samo w obu próbach?","type":"single","options":["Rodzaj rośliny, woda, gleba i temperatura","Kolor informacji w zeszycie","Dostęp do światła","Położenie mapy"],"answer":0,"explain":"W tym badaniu dostęp do światła powinien się różnić, a inne warunki powinny być podobne."},{"id":"D117","cat":"D","level":"R","page":41,"q":"Co to jest wniosek z doświadczenia?","type":"single","options":["Lista przyrządów","Dowolny pomysł przed badaniem","Zawsze nowa hipoteza bez wyników","Odpowiedź na pytanie badawcze oparta na wynikach"],"answer":3,"explain":"Wniosek wynika z obserwacji i zebranych danych."},{"id":"D118","cat":"D","level":"R","page":35,"q":"Wyjaśnij różnicę między pytaniem badawczym a hipotezą. Podaj krótki przykład.","type":"open","model":"Pytanie badawcze mówi, czego chcemy się dowiedzieć: „Czy światło wpływa na wzrost roślin?”. Hipoteza jest przewidywaną odpowiedzią: „W świetle rośliny będą rozwijać się prawidłowiej”.","criteria":"Punkty za: pytanie jako problem do sprawdzenia; hipoteza jako przewidywanie; przykład spójnej pary.","explain":"Pytanie badawcze mówi, czego chcemy się dowiedzieć: „Czy światło wpływa na wzrost roślin?”. Hipoteza jest przewidywaną odpowiedzią: „W świetle rośliny będą rozwijać się prawidłowiej”."},{"id":"D119","cat":"D","level":"R","page":35,"q":"W badaniu sprawdzamy wpływ wody na kiełkowanie nasion. Zaproponuj próbę kontrolną i badawczą.","type":"open","model":"W dwóch identycznych pojemnikach umieszczamy takie same nasiona w podobnych warunkach. Jedną próbę podlewamy, drugiej nie; obserwujemy kiełkowanie. W badaniu wpływu wody próba z wodą może być badawcza, a bez wody kontrolna, zgodnie z planem.","criteria":"Punkty za: tylko dostęp do wody jako czynnik różniący próby; porównywalne warunki i obserwacja kiełkowania. Akceptuj odwrócone nazewnictwo, jeśli uczniowska definicja prób jest spójna.","explain":"W dwóch identycznych pojemnikach umieszczamy takie same nasiona w podobnych warunkach. Jedną próbę podlewamy, drugiej nie; obserwujemy kiełkowanie. W badaniu wpływu wody próba z wodą może być badawcza, a bez wody kontrolna, zgodnie z planem."},{"id":"D120","cat":"D","level":"R","page":37,"q":"Dlaczego należy dokładnie dokumentować wyniki doświadczenia?","type":"open","model":"Aby nie zapomnieć danych, móc porównać próby, sprawdzić hipotezę i sformułować wniosek. Można użyć tabel, zdjęć, rysunków i wykresów.","criteria":"Punkty za przynajmniej dwie sensowne korzyści dokumentacji oraz przykład sposobu zapisu.","explain":"Aby nie zapomnieć danych, móc porównać próby, sprawdzić hipotezę i sformułować wniosek. Można użyć tabel, zdjęć, rysunków i wykresów."},{"id":"D121","cat":"D","level":"R","page":40,"q":"Wymyśl proste pytanie badawcze i hipotezę dotyczące roślin.","type":"open","model":"Np. pytanie: „Czy fasola kiełkuje szybciej w cieple niż w chłodzie?”. Hipoteza: „Nasiona fasoli w cieple wykiełkują szybciej”.","criteria":"Punkty za sensowne pytanie możliwe do zbadania i logiczną, sprawdzalną hipotezę odpowiadającą na to pytanie.","explain":"Np. pytanie: „Czy fasola kiełkuje szybciej w cieple niż w chłodzie?”. Hipoteza: „Nasiona fasoli w cieple wykiełkują szybciej”."},{"id":"M122","cat":"M","level":"W","page":42,"q":"Do czego służy mikroskop?","type":"single","options":["Do obserwowania bardzo małych obiektów w powiększeniu","Do pomiaru głośności","Do wyznaczania północy","Do mierzenia temperatury"],"answer":0,"explain":"Mikroskop pozwala oglądać detale zbyt małe, by dobrze zobaczyć je gołym okiem."},{"id":"M123","cat":"M","level":"W","page":42,"q":"Jaki przyrząd wykorzystuje światło do obserwacji preparatów?","type":"single","options":["Termometr","Kompas","Detektor dźwięków","Mikroskop świetlny"],"answer":3,"explain":"Mikroskop świetlny wykorzystuje światło do oglądania preparatów."},{"id":"M124","cat":"M","level":"W","page":42,"q":"Jaki mikroskop pozwala oglądać najdrobniejsze obiekty, np. wirusy?","type":"single","options":["Wyłącznie lornetka","Zwykła lupa","Elektronowy","Kompasowy"],"answer":2,"explain":"Mikroskop elektronowy może ukazać obiekty niewidoczne w świetlnym, np. wiele wirusów."},{"id":"M125","cat":"M","level":"W","page":43,"q":"Jak nazywa się część mikroskopu, przez którą patrzymy?","type":"single","options":["Okular","Podstawa","Stolik","Źródło światła"],"answer":0,"explain":"Okular to soczewka umieszczona blisko oka obserwatora."},{"id":"M126","cat":"M","level":"W","page":43,"q":"Jak nazywamy soczewkę mikroskopu znajdującą się blisko preparatu?","type":"single","options":["Stolik","Ramię","Obiektyw","Okular"],"answer":2,"explain":"Obiektyw powiększa obraz preparatu."},{"id":"M127","cat":"M","level":"W","page":43,"q":"Na której części mikroskopu umieszczamy preparat?","type":"single","options":["Na ramieniu","Na stoliku","Na okularze","Na pokrętle ostrości"],"answer":1,"explain":"Preparat umieszcza się na stoliku mikroskopu."},{"id":"M128","cat":"M","level":"W","page":43,"q":"Co umożliwia ustawienie ostrego obrazu pod mikroskopem?","type":"single","options":["Różdżka","Śruba regulacji ostrości","Uchwyt kompasu","Termometr"],"answer":1,"explain":"Pokrętłami regulacji ostrości ustawiamy wyraźny obraz."},{"id":"M129","cat":"M","level":"W","page":43,"q":"Co dostarcza światło w mikroskopie świetlnym?","type":"single","options":["Źródło światła","Rewolwer","Tuba okularu","Stolik"],"answer":0,"explain":"Oświetlenie preparatu umożliwia jego obserwację."},{"id":"M130","cat":"M","level":"W","page":43,"q":"Do czego służy rewolwer mikroskopu?","type":"single","options":["Do pomiaru masy","Do ustawiania północy","Do zmiany obiektywów i powiększenia","Do mieszania wody"],"answer":2,"explain":"Obrót rewolweru pozwala wybrać obiektyw o innym powiększeniu."},{"id":"M131","cat":"M","level":"W","page":43,"q":"Połącz element mikroskopu z funkcją.","type":"match","pairs":[["Okular","Patrzymy przez niego"],["Obiektyw","Powiększa obraz preparatu"],["Stolik","Utrzymuje preparat"],["Śruba ostrości","Wyostrza obraz"],["Źródło światła","Oświetla preparat"]],"explain":"Części mikroskopu współpracują, aby wyświetlać ostry, powiększony obraz."},{"id":"M132","cat":"M","level":"R","page":43,"q":"Okular powiększa 10 razy, obiektyw 40 razy. Jakie jest łączne powiększenie?","type":"single","options":["400 razy","4 razy","50 razy","40 razy"],"answer":0,"explain":"Łączne powiększenie = powiększenie okularu × powiększenie obiektywu = 10 × 40 = 400."},{"id":"M133","cat":"M","level":"R","page":43,"q":"Okular ma powiększenie 10×, obiektyw 10×. Ile razy powiększa cały mikroskop?","type":"single","options":["100 razy","20 razy","10 razy","1000 razy"],"answer":0,"explain":"Mnożymy 10 × 10 = 100."},{"id":"M134","cat":"M","level":"R","page":43,"q":"Co się stanie, jeśli zamienisz obiektyw 4× na 10× przy tym samym okularze?","type":"single","options":["Mikroskop stanie się kompasem","Powiększenie zniknie","Zniknie źródło światła","Powiększenie wzrośnie"],"answer":3,"explain":"Większe powiększenie obiektywu zwiększa powiększenie całego mikroskopu."},{"id":"M135","cat":"M","level":"W","page":44,"q":"Jak nazywa się obiekt przygotowany do obserwacji pod mikroskopem?","type":"single","options":["Widnokręgiem","Preparatem mikroskopowym","Mapą","Hipotezą"],"answer":1,"explain":"Preparat mikroskopowy to odpowiednio przygotowany materiał do oglądania."},{"id":"M136","cat":"M","level":"W","page":44,"q":"Na czym zwykle układamy materiał do obserwacji?","type":"single","options":["Na okularze","Na tarczy kompasu","Na skali termometru","Na szkiełku podstawowym"],"answer":3,"explain":"Obiekt do badania umieszcza się na szkiełku podstawowym."},{"id":"M137","cat":"M","level":"W","page":44,"q":"Jak nazywa się cienkie szkiełko nakładane na materiał?","type":"single","options":["Obiektywem","Okularem","Kompasem","Szkiełkiem nakrywkowym"],"answer":3,"explain":"Szkiełko nakrywkowe zabezpiecza i spłaszcza preparat."},{"id":"M138","cat":"M","level":"W","page":44,"q":"Ułóż etapy przygotowania prostego mokrego preparatu.","type":"order","steps":["Przygotuj czyste szkiełko podstawowe","Umieść na nim kroplę wody","Włóż niewielki fragment materiału do kropli","Delikatnie przykryj szkiełkiem nakrywkowym","Połóż preparat na stoliku mikroskopu"],"explain":"Cienki fragment materiału umieszcza się w kropli wody na szkiełku i przykrywa szkiełkiem nakrywkowym."},{"id":"M139","cat":"M","level":"R","page":44,"q":"Dlaczego do preparatu wybiera się cienki fragment skórki cebuli?","type":"single","options":["Bo mikroskop nie używa światła","Światło łatwiej przez niego przechodzi, więc widać komórki","Bo wtedy cebula zmienia się w metal","Bo komórki znikają"],"answer":1,"explain":"Cienka warstwa jest łatwiejsza do obserwacji w mikroskopie świetlnym."},{"id":"M140","cat":"M","level":"R","page":44,"q":"Od jakiego powiększenia warto zacząć obserwację mikroskopową?","type":"single","options":["Od schowanego obiektywu","Od losowego, bez regulacji","Od najmniejszego dostępnego","Od największego"],"answer":2,"explain":"Najpierw korzystamy z małego powiększenia, łatwiej znaleźć obiekt i ustawić ostrość."},{"id":"M141","cat":"M","level":"R","page":44,"q":"Dlaczego należy delikatnie opuszczać szkiełko nakrywkowe?","type":"single","options":["Aby zmierzyć temperaturę","Aby nadać mu pole magnetyczne","By ograniczyć powstawanie pęcherzyków powietrza i nie uszkodzić preparatu","Aby zwiększyć jego masę"],"answer":2,"explain":"Delikatne nakrywanie pomaga uniknąć pęcherzyków i uszkodzeń."},{"id":"M142","cat":"M","level":"W","page":45,"q":"Jaka jest najmniejsza podstawowa jednostka budowy organizmów?","type":"single","options":["Organizm","Narząd","Komórka","Układ narządów"],"answer":2,"explain":"Komórka jest podstawową jednostką budowy żywych organizmów."},{"id":"M143","cat":"M","level":"W","page":45,"q":"Co tworzą komórki o podobnej budowie i funkcji u organizmów wielokomórkowych?","type":"single","options":["Glebę","Kontynent","Tkankę","Kompas"],"answer":2,"explain":"Podobne wyspecjalizowane komórki tworzą tkanki."},{"id":"M144","cat":"M","level":"W","page":45,"q":"Co tworzą różne tkanki współpracujące przy wykonaniu funkcji?","type":"single","options":["Zawsze minerał","Narząd","Wyłącznie komórkę","Powietrze"],"answer":1,"explain":"Narząd jest zbudowany z tkanek."},{"id":"M145","cat":"M","level":"W","page":45,"q":"Czym jest układ narządów?","type":"single","options":["Zbiorem samych komórek krwi","Zespołem narządów współpracujących przy wykonywaniu funkcji","Rodzajem gleby","Nazwą mikroskopu"],"answer":1,"explain":"Układ narządów to powiązane narządy pełniące wspólną funkcję."},{"id":"M146","cat":"M","level":"W","page":45,"q":"Ułóż poziomy budowy organizmu od najmniejszego do największego.","type":"order","steps":["Komórka","Tkanka","Narząd","Układ narządów","Organizm"],"explain":"Hierarchia: komórka → tkanka → narząd → układ narządów → organizm."},{"id":"M147","cat":"M","level":"R","page":45,"q":"Która kolejność przedstawia budowę rośliny od najmniejszej jednostki?","type":"single","options":["Komórka → tkanka → organ → organizm","Liść → komórka → tkanka","Tkanka → komórka → organizm","Organizm → tkanka → komórka"],"answer":0,"explain":"Komórki tworzą tkanki, tkanki organy, a organy organizm roślinny."},{"id":"M148","cat":"M","level":"W","page":45,"q":"Który przykład jest narządem człowieka?","type":"single","options":["Woda","Komórka mięśniowa","Pies","Serce"],"answer":3,"explain":"Serce jest narządem składającym się z tkanek."},{"id":"M149","cat":"M","level":"W","page":45,"q":"Który przykład jest organem rośliny?","type":"single","options":["Powietrze","Liść","Pojedyncza komórka","Dąb jako całość"],"answer":1,"explain":"Liść jest organem rośliny."},{"id":"M150","cat":"M","level":"R","page":45,"q":"Czy każdy organizm ma tkanki i narządy?","type":"single","options":["Tak, nawet bakteria zawsze ma serce","Nie, organizmy jednokomórkowe składają się z jednej komórki","Tak, każda komórka ma liść","Nie, bo organizmy nie mają komórek"],"answer":1,"explain":"Wiele organizmów jest jednokomórkowych i nie tworzy tkanek ani narządów."},{"id":"M151","cat":"M","level":"W","page":46,"q":"Co należy zrobić po zakończeniu pracy z mikroskopem?","type":"single","options":["Schować mokry mikroskop bez wycierania","Dotykać palcami soczewek","Zostawić rozlaną wodę","Uporządkować stanowisko, usunąć preparat i zadbać o sprzęt"],"answer":3,"explain":"Po obserwacji dbamy o czystość preparatów, optyki i stanowiska pracy."},{"id":"M152","cat":"M","level":"R","page":47,"q":"Pantofelek jest przykładem…","type":"single","options":["Organizmu jednokomórkowego","Minerału","Ciała niebieskiego","Tkanki człowieka"],"answer":0,"explain":"Pantofelek jest protistem jednokomórkowym."},{"id":"M153","cat":"M","level":"W","page":48,"q":"Do jakiej obserwacji najlepiej nadaje się mikroskop?","type":"single","options":["Odległych planet","Chmur na odległym niebie","Komórek skórki cebuli","Całej góry"],"answer":2,"explain":"Mikroskop pozwala oglądać komórki i drobne organizmy."},{"id":"M154","cat":"M","level":"R","page":48,"q":"Jak porusza się euglena zielona?","type":"single","options":["Dzięki wici","Nie może się poruszać","Dzięki butom","Dzięki skrzydłom"],"answer":0,"explain":"Euglena porusza się za pomocą wici."},{"id":"M155","cat":"M","level":"R","page":49,"q":"Dlaczego samo powiększenie nie wystarcza, aby zobaczyć szczegóły preparatu?","type":"single","options":["Bo światło nie ma znaczenia","Bo preparat musi być zawsze ciemny","Bo soczewki nie tworzą obrazu","Potrzebne są także odpowiednie oświetlenie i ostrość"],"answer":3,"explain":"Wyraźna obserwacja wymaga odpowiedniego oświetlenia i ustawionej ostrości."},{"id":"M156","cat":"M","level":"W","page":49,"q":"Które z wymienionych to elementy mechaniczne mikroskopu?","type":"multi","options":["Pokrętła ostrości","Okular","Źródło światła","Stolik","Statyw"],"answer":[0,3,4],"explain":"Elementy mechaniczne podtrzymują i ustawiają mikroskop; okular jest optyczny."},{"id":"M157","cat":"M","level":"W","page":49,"q":"Które z wymienionych to elementy optyczne mikroskopu świetlnego?","type":"multi","options":["Statyw","Źródło światła","Okular","Stolik","Obiektyw"],"answer":[1,2,4],"explain":"Do części optycznych i oświetlających należą okular, obiektywy i źródło światła."},{"id":"M158","cat":"M","level":"R","page":43,"q":"Wyjaśnij, jak obliczyć całkowite powiększenie mikroskopu, gdy okular ma 10×, a obiektyw 40×.","type":"open","model":"Mnożę powiększenie okularu przez powiększenie obiektywu: 10 × 40 = 400. Obraz jest powiększony 400 razy.","criteria":"Punkty za mnożenie wartości 10× i 40× i prawidłowy wynik 400×.","explain":"Mnożę powiększenie okularu przez powiększenie obiektywu: 10 × 40 = 400. Obraz jest powiększony 400 razy."},{"id":"M159","cat":"M","level":"R","page":44,"q":"Opisz krótko, jak przygotować mokry preparat ze skórki cebuli do obserwacji.","type":"open","model":"Na szkiełko podstawowe daję kroplę wody i cienki fragment skórki cebuli, delikatnie nakładam szkiełko nakrywkowe i kładę preparat na stoliku mikroskopu.","criteria":"Punkty za: szkiełko podstawowe, woda i materiał, nakrycie szkiełkiem, umieszczenie na stoliku.","explain":"Na szkiełko podstawowe daję kroplę wody i cienki fragment skórki cebuli, delikatnie nakładam szkiełko nakrywkowe i kładę preparat na stoliku mikroskopu."},{"id":"M160","cat":"M","level":"R","page":45,"q":"Opisz budowę organizmu wielokomórkowego od komórki do całego organizmu.","type":"open","model":"Komórki tworzą tkanki; tkanki budują narządy; narządy mogą tworzyć układy narządów, które razem budują organizm.","criteria":"Punkty za prawidłowe rozumienie kolejności komórka → tkanka → narząd → układ narządów → organizm.","explain":"Komórki tworzą tkanki; tkanki budują narządy; narządy mogą tworzyć układy narządów, które razem budują organizm."},{"id":"P161","cat":"P","level":"R","page":56,"q":"Który element jest antropogeniczny, a nie naturalny?","type":"single","options":["Granit","Rzeka","Sosna","Autostrada"],"answer":3,"explain":"Autostrada powstała w wyniku działalności człowieka."},{"id":"P162","cat":"P","level":"R","page":56,"q":"Czy bakterie zaliczamy do składników przyrody ożywionej?","type":"single","options":["Nie, bo są niewidoczne gołym okiem","Tak, są organizmami zbudowanymi z komórek","Tylko gdy żyją na drzewach","Nie, bo są małe"],"answer":1,"explain":"Bakterie to organizmy jednokomórkowe."},{"id":"Z163","cat":"Z","level":"R","page":57,"q":"Gdy słyszysz grzmot, który narząd odebrał bodziec?","type":"single","options":["Ucho","Język","Skóra","Nos"],"answer":0,"explain":"Dźwięk grzmotu odbieramy słuchem."},{"id":"K164","cat":"K","level":"R","page":57,"q":"Kompas wskazuje północ niezależnie od trzymania go blisko silnego magnesu. Prawda czy fałsz?","type":"single","options":["Fałsz","Prawda"],"answer":0,"explain":"Magnes może zakłócić wskazania igły kompasu."},{"id":"K165","cat":"K","level":"R","page":57,"q":"Czy kierunek północny oznacza się na mapach zwykle literą N?","type":"single","options":["Nie","Tak"],"answer":1,"explain":"N to north – północ."},{"id":"D166","cat":"D","level":"R","page":57,"q":"Przy próbie badania wpływu światła na kiełkowanie należy zmienić również ilość wody. Prawda czy fałsz?","type":"single","options":["Prawda","Fałsz"],"answer":1,"explain":"Przy sprawdzaniu jednego czynnika inne warunki powinny pozostać porównywalne."},{"id":"D167","cat":"D","level":"R","page":58,"q":"Dwie doniczki mają taką samą ziemię i wodę. Jedna stoi na oknie, druga w szafie. Co badamy?","type":"single","options":["Wpływ rodzaju gleby","Wpływ wielkości doniczki","Wpływ ilości wody","Wpływ światła na rośliny"],"answer":3,"explain":"Zmienną jest dostęp do światła."},{"id":"M168","cat":"M","level":"R","page":58,"q":"Który zestaw najlepiej oglądać pod mikroskopem świetlnym?","type":"single","options":["Chmury i tęczę","Planety i gwiazdy","Cały samochód i dom","Komórki skórki cebuli i pantofelka"],"answer":3,"explain":"Mikroskop służy do obserwacji drobnych obiektów."},{"id":"D169","cat":"D","level":"R","page":58,"q":"Dwie identyczne doniczki rzeżuchy: jedna stoi w słońcu, a druga w ciemnej szafie. Jaka może być hipoteza i wniosek po tygodniu, jeśli w świetle roślina jest zielona i mocna, a w ciemności blada i wiotka?","type":"open","model":"Hipoteza: światło ma wpływ na prawidłowy rozwój roślin. Wniosek: roślina z dostępem do światła była zielona i silniejsza, a roślina w ciemności blada i wyciągnięta, więc światło jest ważne dla jej prawidłowego rozwoju.","criteria":"Punkty za: spójną hipotezę o świetle; wniosek oparty na porównaniu dwóch wyników.","explain":"Hipoteza: światło ma wpływ na prawidłowy rozwój roślin. Wniosek: roślina z dostępem do światła była zielona i silniejsza, a roślina w ciemności blada i wyciągnięta, więc światło jest ważne dla jej prawidłowego rozwoju."}]</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('questions').textContent);
const TOPICS=[{id:'P',name:'Co to jest przyroda?',label:'Świat wokół nas',emoji:'🌱',pages:'10–15'}, {id:'Z',name:'Jak moje zmysły pomagają poznawać przyrodę?',label:'Zmysły i przyrządy',emoji:'👁️',pages:'16–23'}, {id:'K',name:'Jak nie zgubić się w terenie?',label:'Mapa i kompas',emoji:'🧭',pages:'24–33'}, {id:'D',name:'Jak prowadzić doświadczenia przyrodnicze?',label:'Mali naukowcy',emoji:'🧪',pages:'34–41'}, {id:'M',name:'Jak oglądać mikroświat?',label:'Mikroskop i komórki',emoji:'🔬',pages:'42–49'}];
const STORE='misja_przyroda_okiem_badacza_v1';
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(STORE)||'{}');
    const history=Array.isArray(o.history)?o.history:[];
    // Migracja v1.2: sprawdziany już rozwiązane też powinny zejść z puli.
    const oldExamIds=history.filter(s=>s.mode==='exam').flatMap(s=>(s.entries||[]).filter(e=>e.status!=='skip').map(e=>e.id));
    const examUsed=Array.isArray(o.examUsed)?o.examUsed:[...new Set(oldExamIds)];
    return {history,prefs:o.prefs||{},examUsed:[...new Set(examUsed)]};
  }catch(e){return {history:[],prefs:{},examUsed:[]}}
}
let saved=load();
let state={view:'home',chosen:saved.prefs.chosen||['P','Z','K','D','M'],mode:'practice',level:'all',count:15,includeOpen:true,session:null,report:null,reviewIds:null,viewHistory:false,aiBlocked:false,loading:false,delayUntil:0,printKey:false};
const IN_EDUHUB=Boolean(window.EduHub?.isEduHub)||/\/apps\/a_[a-f0-9]{24}\/?$/.test(location.pathname);
const sharedGroqKey=()=>{try{return window.EduHub?.getGroqKey?.()||localStorage.getItem('eduhub:groq-key')||'';}catch(e){return '';}};
let aiKey=sharedGroqKey();if(!aiKey&&!IN_EDUHUB){try{aiKey=sessionStorage.getItem('przyroda_groq_key')||''}catch(e){}}
let aiModel=saved.prefs.aiModel||'openai/gpt-oss-20b';
const $=q=>document.querySelector(q);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
// Losowanie pozycji odpowiedzi tylko raz na sesję; wyrównujemy A/B/C/D w każdej grupie pytań.
// Wartości w tablicy są oryginalnymi indeksami, dlatego klucze odpowiedzi nie ulegają zmianie.
function buildOptionOrder(questions){
  const order={},remaining={};
  for(const q of rnd(questions.filter(q=>q.type==='single'||q.type==='multi'))){
    const len=q.options.length;
    const indices=rnd(Array.from({length:len},(_,i)=>i));
    if(q.type==='single'){
      if(!remaining[len]?.length)remaining[len]=rnd(Array.from({length:len},(_,i)=>i));
      const target=remaining[len].pop(),at=indices.indexOf(q.answer);
      [indices[target],indices[at]]=[indices[at],indices[target]];
    }
    order[q.id]=indices;
  }
  return order;
}
function displayedOptions(q,session=state.session){
  return session?.optionOrder?.[q.id]||q.options.map((_,i)=>i);
}

const iconCompass=()=>`<div class="compass" aria-hidden="true"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="87" fill="#f7fff3" opacity=".8"/><circle cx="100" cy="100" r="75" fill="none" stroke="#49885e" stroke-width="2"/><path d="M100 20L113 89L180 100L113 111L100 180L87 111L20 100L87 89Z" fill="#367c59"/><path d="M100 20L113 89L100 100Z" fill="#e27c54"/><circle cx="100" cy="100" r="12" fill="#fff" stroke="#4a885e" stroke-width="3"/><g font-size="14" font-weight="900" fill="#3d6b51" text-anchor="middle"><text x="100" y="14">N</text><text x="190" y="105">E</text><text x="100" y="197">S</text><text x="11" y="105">W</text></g></svg></div>`;
const qById=id=>DATA.find(q=>q.id===id);
const eligibleOpen=()=>Boolean(aiKey&&!state.aiBlocked&&navigator.onLine!==false&&state.includeOpen);
const dateFmt=s=>new Date(s).toLocaleString('pl-PL',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function persist(){try{saved.prefs.chosen=state.chosen;saved.prefs.aiModel=aiModel;localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){}}

// Mowa -> tekst. Jeden przycisk działa tylko w polu odpowiedzi opisowej.
const SpeechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceSession = null;
const microphoneIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"></path></svg>';
function cancelVoice(){
  if(!voiceSession)return;
  const s=voiceSession;voiceSession=null;
  try{s.rec.abort()}catch(e){}
}
function voiceNotice(message,isError=false){
  const el=$('#voice-status');if(!el)return;
  el.textContent=message;el.classList.toggle('error',isError);
}
function speechJoined(before,spoken){
  before=(before||'').trim();spoken=(spoken||'').trim();
  return before&&spoken?before+' '+spoken:before||spoken;
}
// Some Web Speech implementations return cumulative overlapping chunks.
// Join only the new words; interim results are previews, not additional dictation.
function joinSpeechSegments(parts){
  const words=[];
  for(const part of parts){
    const incoming=String(part||'').trim().split(/\s+/).filter(Boolean);
    if(!incoming.length)continue;
    const simplify=s=>s.toLocaleLowerCase('pl-PL').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');
    const left=words.map(simplify),right=incoming.map(simplify);
    let overlap=0;
    for(let len=Math.min(left.length,right.length);len>0;len--){
      if(left.slice(-len).every((word,i)=>word===right[i])){overlap=len;break;}
    }
    words.push(...incoming.slice(overlap));
  }
  return words.join(' ');
}
function currentVoiceText(session){
  return speechJoined(session.base,joinSpeechSegments([session.final,session.interim]));
}
function setVoiceInterface(){
  const btn=$('#voice-mic'),field=$('#openanswer'),checkBtn=$('#check');
  const active=!!voiceSession;
  if(btn){
    btn.classList.toggle('listening',active);
    btn.setAttribute('aria-pressed',String(active));
    btn.setAttribute('aria-label',active?'Zatrzymaj dyktowanie':'Rozpocznij dyktowanie po polsku');
    btn.title=active?'Zatrzymaj dyktowanie':'Dyktuj odpowiedź';
  }
  if(field)field.readOnly=active;
  if(checkBtn&&!currentEntry())checkBtn.disabled=active||state.loading||state.essay.trim().length<3;
}
function voiceErrorLabel(err){
  if(err==='not-allowed'||err==='service-not-allowed')return 'Mikrofon jest zablokowany. Zezwól przeglądarce na używanie mikrofonu.';
  if(err==='audio-capture')return 'Nie wykryto dostępnego mikrofonu.';
  if(err==='network')return 'Rozpoznawanie mowy wymaga połączenia lub jest zablokowane dla lokalnego pliku HTML. Możesz użyć mikrofonu klawiatury.';
  if(err==='language-not-supported')return 'Ta przeglądarka nie obsługuje rozpoznawania języka polskiego.';
  if(err==='no-speech')return 'Nie wykryto mowy. Spróbuj ponownie i mów wyraźnie.';
  return 'Dyktowanie nie powiodło się. Możesz wpisać odpowiedź z klawiatury.';
}
function toggleVoice(){
  const q=currentQ(),field=$('#openanswer');
  if(!q||q.type!=='open'||currentEntry()||state.loading||!field)return;
  if(voiceSession){
    if(!voiceSession.stopping){
      voiceSession.stopping=true;voiceNotice('Kończę nasłuchiwanie…');
      try{voiceSession.rec.stop()}catch(e){cancelVoice();setVoiceInterface()}
    }
    return;
  }
  if(!SpeechApi){voiceNotice('Ta przeglądarka nie obsługuje dyktowania. Użyj mikrofonu na klawiaturze ekranowej lub wpisz odpowiedź.',true);return}
  let rec;
  try{rec=new SpeechApi()}catch(e){voiceNotice('Nie udało się uruchomić rozpoznawania mowy.',true);return}
  // Android Chrome: continuous=true can repeatedly return overlapping phrases.
  // A single recognition segment is stable; tap again to append another sentence.
  rec.lang='pl-PL';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
  const session={rec,questionId:q.id,base:state.essay,final:'',interim:'',stopping:false,error:''};
  voiceSession=session;setVoiceInterface();
  voiceNotice('🎙 Uruchamianie mikrofonu…');
  rec.onstart=()=>{if(voiceSession===session)voiceNotice('🔴 Słucham… Mów po polsku. Naciśnij mikrofon ponownie, aby zakończyć.')};
  rec.onresult=e=>{
    if(voiceSession!==session||currentQ()?.id!==session.questionId)return;
    const finalParts=[],interimParts=[];
    for(let i=0;i<e.results.length;i++){
      const text=(e.results[i]?.[0]?.transcript||'').trim();
      if(!text)continue;
      if(e.results[i].isFinal)finalParts.push(text);else interimParts.push(text);
    }
    session.final=joinSpeechSegments(finalParts);session.interim=joinSpeechSegments(interimParts);
    state.essay=currentVoiceText(session);
    const textarea=$('#openanswer');if(textarea){textarea.value=state.essay;textarea.scrollTop=textarea.scrollHeight}
    setVoiceInterface();
  };
  rec.onerror=e=>{
    if(voiceSession!==session)return;
    session.error=e.error||'unknown';
    voiceNotice(voiceErrorLabel(session.error),true);
  };
  rec.onend=()=>{
    if(voiceSession!==session)return;
    // If the browser never emitted a final result, retain the last provisional text as editable draft.
    state.essay=currentVoiceText(session);
    const textarea=$('#openanswer');if(textarea)textarea.value=state.essay;
    voiceSession=null;setVoiceInterface();
    if(!session.error)voiceNotice(state.essay.trim()?'✅ Zapisano fragment. Możesz ponownie dotknąć 🎙, aby dopowiedzieć kolejne zdanie, albo sprawdzić odpowiedź.':'Nie rozpoznano słów. Dotknij 🎙 i spróbuj ponownie.');
    // Do not reopen the Android soft keyboard after dictation; the user can tap to edit.
  };
  try{rec.start()}catch(e){voiceSession=null;setVoiceInterface();voiceNotice('Nie można rozpocząć dyktowania w tej przeglądarce. Spróbuj mikrofonu klawiatury.',true)}
}


// --- Narzędzia diagnostyczne: nie wymagają pytań opisowych ani AI. ---
const speechDiag = {mic:'Nie testowano', permission:'nieznany', recognition:'Nie testowano', tts:'Nie testowano', final:'', interim:'', rec:null, sttError:'', micError:'', speechDetected:false};
function diagText(id,message,kind=''){
  const element=$(id);
  if(element){ element.textContent=message; element.className='diag-status '+kind; }
}
function diagContext(){
  const secure=window.isSecureContext===true;
  const origin=location.protocol==='file:'?'lokalny plik file://':location.protocol==='https:'?'HTTPS':location.protocol==='http:'?'HTTP':'inny / osadzony';
  return {secure,origin,media:!!navigator.mediaDevices?.getUserMedia,recognition:!!SpeechApi,tts:!!window.speechSynthesis,embedded:window.top!==window};
}
function diagAdvice(err,kind){
  const name=String(err?.name||err||'unknown');
  if(name==='NotAllowedError'||name==='PermissionDeniedError'||name==='not-allowed'||name==='service-not-allowed')
    return 'Odmowa dostępu. Sprawdź uprawnienie mikrofonu dla tej strony/pliku oraz dostęp Chrome do mikrofonu w ustawieniach systemu. Jeśli wcześniej odmówiono, przeglądarka może nie pytać ponownie.';
  if(name==='NotFoundError'||name==='DevicesNotFoundError'||name==='audio-capture')return 'Nie znaleziono mikrofonu. Sprawdź urządzenie lub uprawnienia systemowe.';
  if(name==='NotReadableError'||name==='TrackStartError')return 'Mikrofon jest zajęty albo niedostępny dla przeglądarki.';
  if(name==='SecurityError'||name==='TypeError')return 'Kontekst uruchomienia blokuje dostęp do urządzenia. Otwórz plik bezpośrednio w Chrome; podgląd plików i niektóre adresy content:// mogą nie działać.';
  if(name==='network')return 'Usługa rozpoznawania nie ma połączenia lub przeglądarka jej nie udostępnia. Sam mikrofon może być sprawny.';
  if(name==='language-not-supported'||name==='language-unavailable')return 'Język polski nie jest obsługiwany przez tę usługę rozpoznawania.';
  if(name==='no-speech')return 'Nie wykryto głosu. Sprawdź poziom dźwięku lub spróbuj ponownie.';
  if(name==='aborted')return 'Test został zatrzymany.';
  return kind==='speech'?'Przeglądarka nie uruchomiła rozpoznawania. Spróbuj w najnowszym Chrome albo użyj mikrofonu klawiatury.':'Sprawdź uprawnienia i urządzenie mikrofonowe.';
}
function diagRefreshInfo(){
  const c=diagContext();
  const txt=`Kontekst: ${c.origin}\nBezpieczny kontekst: ${c.secure?'TAK':'NIE'}\nAPI mikrofonu (getUserMedia): ${c.media?'dostępne':'BRAK'}\nWeb Speech (rozpoznawanie): ${c.recognition?'dostępne':'BRAK'}\nSynteza mowy (TTS): ${c.tts?'dostępna':'BRAK'}\nOsadzenie w innym oknie: ${c.embedded?'TAK':'NIE'}\nPozwolenie mikrofonu: ${speechDiag.permission}\nWynik próby mikrofonu: ${speechDiag.mic}\nWynik dyktowania: ${speechDiag.recognition}${speechDiag.sttError?' ('+speechDiag.sttError+')':''}\nWynik TTS: ${speechDiag.tts}\nPrzeglądarka: ${navigator.userAgent}`;
  const target=$('#diag-details');if(target)target.textContent=txt;
  const sum=$('#diag-summary');if(sum)sum.textContent=c.secure&&c.media&&c.recognition?'API są dostępne. Użyj przycisków poniżej, by sprawdzić rzeczywiste działanie.':
    !c.secure?'To nie jest bezpieczny kontekst. W tym trybie przeglądarka może blokować mikrofon.':
    !c.media?'Brak API mikrofonu w tym kontekście. Próba nie spowoduje pytania o uprawnienie.':
    'Rozpoznawanie mowy nie jest obsługiwane. Możesz mimo to przetestować mikrofon.';
}
async function diagReadPermission(){
  if(!navigator.permissions?.query){speechDiag.permission='przeglądarka nie umożliwia odczytu';diagRefreshInfo();return}
  try{
    const p=await navigator.permissions.query({name:'microphone'});
    speechDiag.permission=p.state==='granted'?'udzielono (granted)':p.state==='denied'?'zablokowano (denied)':p.state==='prompt'?'pytanie możliwe (prompt)':p.state;
    diagRefreshInfo();
  }catch(e){speechDiag.permission='status niedostępny (to nie oznacza blokady)';diagRefreshInfo()}
}

async function diagMicTest(){
  if(!navigator.mediaDevices?.getUserMedia){speechDiag.mic='NIEDOSTĘPNE: API getUserMedia nie istnieje w tym kontekście.';diagText('#diag-mic-status',speechDiag.mic,'fail');diagRefreshInfo();return}
  const b=$('#diag-mic');if(b)b.disabled=true;
  diagText('#diag-mic-status','Proszę przeglądarkę o dostęp do mikrofonu… Jeżeli pojawi się okno, wybierz Zezwól.','warn');
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    const track=stream.getAudioTracks()[0];
    speechDiag.mic=`OK: dostęp do mikrofonu uzyskany (${track?.label||'urządzenie audio'}). Test zakończony, mikrofon wyłączony.`;
    speechDiag.micError='';diagText('#diag-mic-status',speechDiag.mic,'ok');
  }catch(error){
    speechDiag.micError=error?.name||'unknown';
    speechDiag.mic=`BŁĄD ${speechDiag.micError}: ${diagAdvice(error,'microphone')}`;
    diagText('#diag-mic-status',speechDiag.mic,'fail');
  }finally{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    if(b)b.disabled=false;
    await diagReadPermission();
    if(state.view==='voice-diag'&&$('#diag-permission'))$('#diag-permission').textContent=speechDiag.permission;
    diagRefreshInfo();
  }
}
function stopDiagnosticSpeech(abort=false){
  const rec=speechDiag.rec;
  if(!rec)return;
  speechDiag.rec=null;
  try{ if(abort)rec.abort();else rec.stop() }catch(e){}
  if(!abort){speechDiag.recognition='Zatrzymano dyktowanie.';diagText('#diag-stt-status',speechDiag.recognition,'warn')}
  const start=$('#diag-stt'),stop=$('#diag-stop');if(start)start.disabled=!SpeechApi;if(stop)stop.disabled=true;
  diagRefreshInfo();
}
function diagSttTest(){
  if(!SpeechApi){diagText('#diag-stt-status','Ta przeglądarka nie udostępnia SpeechRecognition.','fail');return}
  if(speechDiag.rec)stopDiagnosticSpeech(true);
  let rec;
  try{rec=new SpeechApi()}catch(e){diagText('#diag-stt-status','Nie można utworzyć SpeechRecognition: '+e.message,'fail');return}
  rec.lang='pl-PL';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  speechDiag.final='';speechDiag.interim='';speechDiag.sttError='';speechDiag.speechDetected=false;speechDiag.rec=rec;
  if($('#diag-transcript'))$('#diag-transcript').value='';
  const start=$('#diag-stt'),stop=$('#diag-stop');if(start)start.disabled=true;if(stop)stop.disabled=false;
  const setMsg=(msg,cls='')=>{speechDiag.recognition=msg;diagText('#diag-stt-status',msg,cls);diagRefreshInfo()};
  rec.onstart=()=>{if(speechDiag.rec===rec)setMsg('🔴 Nasłuchuję. Powiedz zdanie testowe.','warn')};
  rec.onresult=e=>{
    if(speechDiag.rec!==rec)return;
    speechDiag.speechDetected=true;
    const fin=[],inter=[];
    for(let i=0;i<e.results.length;i++){const t=(e.results[i]?.[0]?.transcript||'').trim();if(e.results[i].isFinal)fin.push(t);else inter.push(t)}
    speechDiag.final=joinSpeechSegments(fin);speechDiag.interim=joinSpeechSegments(inter);
    const ta=$('#diag-transcript');if(ta)ta.value=joinSpeechSegments([speechDiag.final,speechDiag.interim]);
    setMsg('✅ Usługa zwróciła tekst. Możesz zakończyć lub poczekać na koniec wypowiedzi.','ok');
  };
  rec.onerror=e=>{
    if(speechDiag.rec!==rec)return;
    speechDiag.sttError=e.error||'unknown';
    setMsg(`BŁĄD ${speechDiag.sttError}: ${diagAdvice(speechDiag.sttError,'speech')}`,'fail');
  };
  rec.onend=()=>{
    if(speechDiag.rec!==rec)return;
    speechDiag.rec=null;
    if(start)start.disabled=false;if(stop)stop.disabled=true;
    if(!speechDiag.sttError)setMsg(speechDiag.speechDetected?'✅ Dyktowanie działa — rozpoznano wypowiedź.':'Koniec testu — nie rozpoznano wypowiedzi.',speechDiag.speechDetected?'ok':'warn');
    diagRefreshInfo();
  };
  try{setMsg('Uruchamiam rozpoznawanie mowy…','warn');rec.start()}
  catch(e){speechDiag.sttError=e.name||'unknown';speechDiag.rec=null;if(start)start.disabled=false;if(stop)stop.disabled=true;setMsg(`BŁĄD ${speechDiag.sttError}: ${diagAdvice(e,'speech')}`,'fail')}
}
function diagTtsTest(){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){speechDiag.tts='Niedostępne: brak syntezy mowy w tej przeglądarce.';diagText('#diag-tts-status',speechDiag.tts,'fail');return}
  try{
    speechSynthesis.cancel();
    const msg=new SpeechSynthesisUtterance('Witaj w Misji Przyroda. Mikrofon i mowa mogą pomóc Ci w nauce.');
    msg.lang='pl-PL';msg.rate=.92;
    msg.onstart=()=>{speechDiag.tts='🔊 Odtwarzam zdanie…';diagText('#diag-tts-status',speechDiag.tts,'warn');diagRefreshInfo()};
    msg.onend=()=>{speechDiag.tts='✅ Odczyt zdania zakończony.';diagText('#diag-tts-status',speechDiag.tts,'ok');diagRefreshInfo()};
    msg.onerror=e=>{speechDiag.tts='Błąd syntezy: '+(e.error||'unknown');diagText('#diag-tts-status',speechDiag.tts,'fail');diagRefreshInfo()};
    speechDiag.tts='Zlecam odczyt…';diagText('#diag-tts-status',speechDiag.tts,'warn');speechSynthesis.speak(msg);
  }catch(e){speechDiag.tts='Błąd TTS: '+(e.message||e.name);diagText('#diag-tts-status',speechDiag.tts,'fail')}
  diagRefreshInfo();
}
async function diagCopy(){
  const text=$('#diag-details')?.textContent||'';
  try{
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}
    else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();if(!document.execCommand('copy'))throw Error('Kopiowanie jest niedostępne');ta.remove()}
    if($('#diag-copy-status'))$('#diag-copy-status').textContent='Skopiowano. Możesz wkleić wynik do rozmowy.';
  }catch(e){if($('#diag-copy-status'))$('#diag-copy-status').textContent='Przeglądarka zablokowała kopiowanie. Zaznacz tekst raportu ręcznie.'}
}

function entries(){return saved.history.flatMap(x=>x.entries||[]).filter(x=>x.status!=='skip')}
function mastery(cat){let es=entries().filter(x=>qById(x.id)?.cat===cat);if(!es.length)return null;return Math.round(100*es.reduce((a,x)=>a+(x.score||0),0)/(es.length*2))}
function countAvailable(cat){return DATA.filter(q=>q.cat===cat).length}
function activePool(){return DATA.filter(q=>state.chosen.includes(q.cat)&&(state.level==='all'||q.level===state.level)&&(q.type!=='open'||eligibleOpen()))}
function examPoolStats(pool=activePool()){
  const seen=new Set(saved.examUsed);
  const remaining=pool.filter(q=>!seen.has(q.id)).length;
  return {total:pool.length,remaining,used:pool.length-remaining};
}
// Pierwszeństwo mają pytania nierozwiązywane w bieżącym cyklu.
// Gdy ich zabraknie, dopełniamy zestaw z nowego cyklu bez powtórek wewnątrz testu.

function chooseExam(pool,count){
  const max=Math.min(count,pool.length),used=new Set(saved.examUsed);
  const fresh=pool.filter(q=>!used.has(q.id));
  const initial=chooseSession(fresh,Math.min(max,fresh.length));
  const extras=initial.length<max?chooseSession(pool.filter(q=>!initial.some(x=>x.id===q.id)),max-initial.length):[];
  return {questions:[...initial,...extras],rolloverAt:extras.length?initial.length:null,eligibleIds:pool.map(q=>q.id)};
}
function saveExamUsage(sess){
  if(sess.mode!=='exam')return;
  const done=sess.entries.filter(e=>e.status!=='skip');
  if(!done.length)return;
  const crossed=sess.rolloverAt!==null&&sess.rolloverAt!==undefined&&
    done.some(e=>sess.questions.indexOf(e.id)>=sess.rolloverAt);
  const used=new Set(saved.examUsed);
  if(crossed)for(const id of sess.eligibleIds||[])used.delete(id);
  for(const e of done)used.add(e.id);
  saved.examUsed=[...used];
}

function chooseSession(pool,count){const currentStats={};for(const row of entries())if(row.score<2)currentStats[row.id]=(currentStats[row.id]||0)+1;const groups={};for(const q of pool){(groups[q.cat]??=[]).push(q)}const keys=Object.keys(groups);for(const k of keys)groups[k]=rnd(groups[k]).sort((a,b)=>((currentStats[b.id]||0)-(currentStats[a.id]||0)));

function rowAnswer(q,r){return `<div class="review-row"><div class="flex" style="justify-content:space-between"><span><span class="dot ${r.status==='skip'?'skip':r.score===2?'good':r.score===1?'part':'bad'}"></span><strong>${r.status==='skip'?'Pominięte':r.score===2?'Opanowane':r.score===1?'Do utrwalenia':'Do powtórki'}</strong></span><span class="muted" style="font-size:12px">${r.status==='skip'?'–':r.score+'/2 pkt'} · s. ${q.page}</span></div><h4>${esc(q.q)}</h4><p><span class="muted">Twoja odpowiedź:</span> ${esc(r.answer||'—')}</p><p><span class="muted">Klucz:</span> ${esc(formatRight(q))}</p>${r.status!=='skip'?`<p><span class="muted">Wyjaśnienie:</span> ${esc(r.reason||q.explain)}</p>`:''}</div>`}
function results(scroll=false){const r=state.report;if(!r){home();return}state.view='results';const st=resultStats(r),wrong=r.entries.filter(e=>e.status!=='skip'&&e.score<2);let grade=r.percent===null?'Brak ocenionych odpowiedzi':r.percent>=90?'Znakomicie! 🌟':r.percent>=75?'Bardzo dobrze! 🌿':r.percent>=55?'Robisz postępy! 💪':'Każdy błąd to wskazówka 🌱';
app(`<div class="no-print" style="margin-bottom:15px"><button class="button secondary small" data-act="home">← Wróć do startu</button></div><section class="result-banner"><div><div class="eyebrow">Podsumowanie misji</div><h2 style="margin:6px 0">${grade}</h2><p class="muted">${dateFmt(r.finished||r.date)} · ${r.mode==='exam'?'Sprawdzian':r.mode==='review'?'Sesja poprawkowa':'Freestyle'}</p><div class="stat-chips"><span>${r.entries.length} pytań</span><span>${r.earned} / ${r.possible} pkt</span><span>${wrong.length} do powtórki</span>${r.skipped?`<span>${r.skipped} pominięte AI</span>`:''}</div></div><div class="score">${r.percent===null?'—':r.percent+'%'}<small></small></div></section>
<div class="results-grid"><section class="panel"><h2>🗺️ Mapa wiedzy</h2><p class="muted" style="font-size:13px">Zielony: 85–100% · pomarańczowy: 65–84% · czerwony: poniżej 65%.</p>${TOPICS.map(t=>{let d=st[t.id];return `<div class="category-line"><div class="category-line-top"><span>${t.emoji} ${esc(t.label)}</span><span>${d?d.percent+'%':'—'}</span></div><div class="track" style="margin-top:9px"><div class="fill" style="width:${d?d.percent:0}%;background:${d?(d.percent>=85?'#43a875':d.percent>=65?'#e8a44a':'#e17769'):'#cbd5cb'}"></div></div><div class="muted" style="font-size:12px;margin-top:5px">${d?`${d.earned}/${d.max} pkt z ${d.count} pytań`:'Nie sprawdzano w tej misji'}</div></div>`}).join('')}</section><section class="panel"><h2>🧠 Co dalej?</h2>${wrong.length?`<div class="note">Masz ${wrong.length} ${wrong.length===1?'pytanie':'pytań'} do utrwalenia. W sesji poprawkowej pojawią się dokładnie te zagadnienia.</div><button class="button primary full" style="margin-top:18px" data-act="review">🔁 Sesja poprawkowa (${wrong.length})</button>`:`<div class="note">Wszystkie ocenione odpowiedzi były poprawne. Możesz wybrać poziom „Rozumiem”, aby sprawdzić zastosowanie wiedzy.</div>`}
<div style="margin-top:19px"><button class="button secondary full" data-act="print-report">🖨 Drukuj raport dla rodzica</button><button style="margin-top:9px" class="button secondary full" data-act="print-sheet">📄 Drukuj arkusz pytań</button><button style="margin-top:9px" class="button secondary full" data-act="export">⬇ Eksportuj wyniki (JSON)</button></div><p class="tip">Raport i wyniki zawierają błędy oraz właściwe odpowiedzi. Arkusz do druku nie zawiera rozwiązań.</p></section></div>
<section class="panel" style="margin-top:18px"><div class="section-title"><h2>🔍 Odpowiedzi i wyjaśnienia</h2><small>${r.entries.length} pozycji</small></div>${r.entries.length?`<div class="chips no-print" style="margin:10px 0 15px"><button class="chip ${state.resultFilter==='wrong'?'':'on'}" data-act="result-filter" data-value="all">Wszystkie</button><button class="chip ${state.resultFilter==='wrong'?'on':''}" data-act="result-filter" data-value="wrong">Błędy i braki</button></div>${r.entries.filter(e=>state.resultFilter!=='wrong'||e.status!=='skip'&&e.score<2).map(e=>rowAnswer(qById(e.id),e)).join('')||'<div class="empty">Brak błędnych odpowiedzi 🎉</div>'}`:`<div class="empty">Brak pytań w raporcie.</div>`}</section>`);if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function history(){state.view='history';const all=entries(),p=stats(),poolStat=examPoolStats();app(`<div class="narrow"><div class="section-title"><h2>📊 Twoje postępy</h2></div><div class="kpis"><div class="kpi"><strong>${saved.history.length}</strong><small>SESJI</small></div><div class="kpi"><strong>${p.attempts}</strong><small>ODPOWIEDZI</small></div><div class="kpi"><strong>${p.score===null?'—':p.score+'%'}</strong><small>ŚREDNIA</small></div></div><section class="panel"><h2>Opanowanie zagadnień</h2><p class="muted" style="font-size:13px">Wyniki na podstawie wszystkich zapisanych odpowiedzi z tej przeglądarki.</p>${TOPICS.map(t=>{let v=mastery(t.id);return `<div class="category-line"><div class="category-line-top"><span>${t.emoji} ${esc(t.label)}</span><span>${v===null?'—':v+'%'}</span></div><div class="track" style="margin-top:9px"><div class="fill" style="width:${v||0}%;background:${v===null?'#d4dfd5':v>=85?'#43a875':v>=65?'#efb55a':'#e18873'}"></div></div></div>`}).join('')}</section><section class="panel" style="margin-top:16px"><h2>🔄 Pula kolejnych sprawdzianów</h2><p class="muted" style="font-size:13px">Według wybranych zagadnień i poziomu ze strony startowej. Tylko odpowiedzi ze sprawdzianów pomniejszają pulę.</p><div class="category-line-top"><span>Nowe pytania do sprawdzenia</span><span>${poolStat.remaining} / ${poolStat.total}</span></div><div class="track" style="margin:12px 0"><div class="fill" style="width:${poolStat.total?Math.round(100*poolStat.remaining/poolStat.total):0}%"></div></div><div class="note">Gdy zabraknie nowych pytań do pełnego zestawu, aplikacja dokończy sprawdzian pytaniami z odnowionej puli. Freestyle i poprawki jej nie zużywają.</div><button data-act="reset-pool" class="button secondary small" style="margin-top:13px">↻ Odnów pulę teraz</button></section><section class="panel" style="margin-top:16px"><h2>Historia misji</h2>${saved.history.length?saved.history.map((r,i)=>`<div class="history-item"><div><strong>${esc(r.mode==='exam'?'📝 Sprawdzian':r.mode==='review'?'🔁 Poprawka':'🎲 Freestyle')}</strong><br><span class="muted" style="font-size:12px">${dateFmt(r.finished||r.date)} · ${r.entries.length} pytań</span></div><div class="flex"><strong>${r.percent===null?'—':r.percent+'%'}</strong><button data-act="report" data-idx="${i}" class="button secondary small">Raport</button></div></div>`).join(''):'<div class="empty">Nie ma jeszcze historii. Rozpocznij pierwszą misję!</div>'}</section><div style="margin-top:14px"><button data-act="reset" class="button danger small">Wyczyść historię w tej przeglądarce</button></div></div>`)}
function settings(){state.view='settings';app(`<div class="narrow"><div class="section-title"><h2>⚙️ Ustawienia oceny AI</h2></div><section class="panel"><p>Odpowiedzi zamknięte, dopasowywanie i kolejność oceniane są lokalnie. Pytania opisowe przesyłają odpowiedź i klucz do usługi Groq AI — bez własnego serwera.</p><div class="settings-field"><label for="api-key" class="field-label">Klucz Groq API (gsk_…)</label><input class="input" type="password" id="api-key" placeholder="Wklej klucz z GroqCloud" value="${esc(aiKey)}" autocomplete="off" spellcheck="false"><p class="tip">W EduHub używamy jednego wspólnego klucza ustawionego w menu 🔑 Groq. Tutaj możesz go zmienić; poza EduHub klucz działa tylko w tej sesji. Ten plik NIE zawiera klucza.</p></div><div class="settings-field"><label for="ai-model" class="field-label">Model do oceniania</label><select id="ai-model" class="input"><option value="openai/gpt-oss-20b" ${aiModel==='openai/gpt-oss-20b'?'selected':''}>GPT-OSS 20B · szybki i oszczędny</option><option value="openai/gpt-oss-120b" ${aiModel==='openai/gpt-oss-120b'?'selected':''}>GPT-OSS 120B · dokładniejszy, większy</option></select></div><div class="flex"><button class="button primary" data-act="save-ai">Zapisz ustawienia</button><button class="button secondary" data-act="test-ai" id="test-ai">Sprawdź połączenie</button><button class="button danger" data-act="clear-ai">Usuń klucz</button></div><div id="ai-status" class="info-block" style="margin-top:15px">Status: ${aiKey?'klucz wprowadzony':'brak klucza'} · ${navigator.onLine===false?'przeglądarka jest offline':'przeglądarka zgłasza dostęp do sieci (nie oznacza to jeszcze dostępności API)'}</div></section><section class="panel" style="margin-top:16px"><h2>🔐 Prywatność i tryb offline</h2><p>Plik HTML działa lokalnie, bez instalacji i bez serwera. Wyniki zapisują się tylko w pamięci tej przeglądarki. Jeśli AI nie jest skonfigurowane, brakuje internetu albo nie można się połączyć z Groq, pytania opisowe są pomijane bez odejmowania punktów.</p><div class="alert">Klucz API używany w przeglądarce jest dostępny dla jej użytkownika i narzędzi deweloperskich. Nie udostępniaj innym osobom pliku z wpisanym kluczem ani otwartej sesji. Rozważ osobny klucz z niskim limitem. Przeglądarka może też zablokować połączenie sieciowe z lokalnego pliku — aplikacja wtedy pozostanie w pełni użyteczna bez AI.</div><p class="tip">Aktualny endpoint: <code>https://api.groq.com/openai/v1/chat/completions</code></p></section></div>`)}
function saveAI(){let key=$('#api-key')?.value.trim()||'';aiModel=$('#ai-model')?.value||'openai/gpt-oss-20b';aiKey=key;state.aiBlocked=false;try{if(IN_EDUHUB)localStorage.setItem('eduhub:groq-key',key);else sessionStorage.setItem('przyroda_groq_key',key)}catch(e){}persist();settings();$('#ai-status').textContent=key?'Ustawienia zapisane. Możesz włączyć odpowiedzi opisowe na ekranie startowym.':'Klucz usunięty. Pytania opisowe pozostaną pominięte.'}
async function testAI(){const key=$('#api-key')?.value.trim();if(!key){$('#ai-status').textContent='Najpierw wprowadź klucz API.';return}saveAI();let b=$('[data-act="test-ai"]'),box=$('#ai-status');b.disabled=true;box.textContent='Trwa próba połączenia…';let ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',mode:'cors',signal:ac.signal,headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:aiModel,messages:[{role:'user',content:'Napisz dokładnie: OK'}],max_completion_tokens:30})});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error('HTTP '+r.status+' '+(d?.error?.message||''))}box.textContent='✅ Połączenie z Groq działa. Ocena pytań opisowych jest dostępna.';state.aiBlocked=false}catch(e){box.textContent='⚠️ Nie udało się połączyć: '+(e.name==='AbortError'?'Przekroczony czas oczekiwania':e.message)+'. Pozostałe pytania działają offline.';state.aiBlocked=true}finally{clearTimeout(to);b.disabled=false}}
function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportReport(){if(!state.report)return;download('misja-przyroda-raport-'+new Date(state.report.date).toISOString().slice(0,10)+'.json',JSON.stringify({aplikacja:'Misja Przyroda v1.7',report:state.report,topics:TOPICS.map(t=>({id:t.id,name:t.name}))},null,2),'application/json;charset=utf-8')}
function paper(){let r=state.report;if(!r)return;$('#print-area').innerHTML=`<h1>Misja Przyroda — karta pracy</h1><p><strong>Dział I: Okiem badacza</strong> · Data: __________________ · Imię: __________________</p><p>Zadania z podręcznika, strony 10–58. W zadaniach wielokrotnego wyboru zaznacz wszystkie poprawne odpowiedzi.</p>${r.questions.map((id,i)=>{let q=qById(id);if(!q)return'';return `<div class="paper-q"><h3>${i+1}. ${esc(q.q)} <small>(${esc(q.type==='multi'?'wielokrotny wybór':q.type==='single'?'jeden wybór':q.type==='order'?'kolejność':q.type==='match'?'dopasowywanie':'odpowiedź własna')}, s. ${q.page})</small></h3>${q.type==='single'||q.type==='multi'?`<p>${displayedOptions(q,r).map((originalIdx,j)=>`${String.fromCharCode(65+j)}. □ ${esc(q.options[originalIdx])}`).join(' &nbsp; ')}</p>`:q.type==='match'?`<p>${q.pairs.map(p=>esc(p[0])+' — __________________').join(' &nbsp; ')}</p>`:q.type==='order'?`<p>${q.steps.map(x=>'___ '+esc(x)).join('<br>')}</p>`:'<div class="line"></div><div class="line"></div><div class="line"></div>'}</div>`}).join('')}`;document.body.classList.add('printing-sheet');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('printing-sheet'),3500)},60)}
function printReport(){document.body.classList.remove('printing-sheet');state.resultFilter='all';results();window.print()}
function rerender(){if(state.view==='home')home();else if(state.view==='quiz')renderQuiz();else if(state.view==='results')results();else if(state.view==='history')history();else if(state.view==='settings')settings();else if(state.view==='voice-diag')voiceDiagnostics()}
function moveAnswer(idx,dir){const j=idx+dir;if(j<0||j>=state.sequence.length)return;[state.sequence[idx],state.sequence[j]]=[state.sequence[j],state.sequence[idx]];renderQuiz(false)}
// obsługa kliknięć i pól (bez zewnętrznych zależności)
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act;const v=el.dataset.value;
if(act==='home'){if(state.session&&state.session.entries.length&&!confirm('Przerwać misję? Niezapisane odpowiedzi przepadną.'))return;state.session=null;home()}
else if(act==='topic'){let id=el.dataset.cat;state.chosen=state.chosen.includes(id)?state.chosen.filter(x=>x!==id):[...state.chosen,id];persist();home()}
else if(act==='mode'){state.mode=v;if(v==='practice'&&state.count>25)state.count=25;home()}
else if(act==='count'){state.count=+v;home()}
else if(act==='level'){state.level=v;home()}
else if(act==='start')start()
else if(act==='history'){if(state.session&&state.session.entries.length&&!confirm('Przerwać misję? Niezapisane odpowiedzi przepadną.'))return;state.session=null;history()}
else if(act==='settings'){if(state.session&&state.session.entries.length&&!confirm('Przerwać misję? Niezapisane odpowiedzi przepadną.'))return;state.session=null;settings()}
else if(act==='voice-diag'){if(state.session&&state.session.entries.length&&!confirm('Przerwać misję? Niezapisane odpowiedzi przepadną.'))return;state.session=null;voiceDiagnostics()}
else if(act==='diag-mic')await diagMicTest()
else if(act==='diag-refresh'){await diagReadPermission();if($('#diag-permission'))$('#diag-permission').textContent=speechDiag.permission;diagRefreshInfo()}
else if(act==='diag-stt')diagSttTest()
else if(act==='diag-stop')stopDiagnosticSpeech(false)
else if(act==='diag-tts')diagTtsTest()
else if(act==='diag-tts-stop'){if(window.speechSynthesis)speechSynthesis.cancel();speechDiag.tts='Odczyt zatrzymano';diagText('#diag-tts-status',speechDiag.tts);diagRefreshInfo()}
else if(act==='diag-copy')await diagCopy()
else if(act==='select'&&!currentEntry()){let i=+el.dataset.idx;const q=currentQ();if(q.type==='single')state.selection=[i];else state.selection=state.selection.includes(i)?state.selection.filter(x=>x!==i):[...state.selection,i];renderQuiz(false)}
else if(act==='move'&&!currentEntry())moveAnswer(+el.dataset.idx,+el.dataset.dir)
else if(act==='voice')toggleVoice()
 else if(act==='check')await check()
else if(act==='next')next()
else if(act==='quit')quit()
else if(act==='review'){let ids=state.report.entries.filter(x=>x.status!=='skip'&&x.score<2).map(x=>x.id);if(ids.length)startReview(ids)}
else if(act==='report'){state.report=saved.history[+el.dataset.idx];state.resultFilter='all';results(true)}
else if(act==='result-filter'){state.resultFilter=v;results()}
else if(act==='print-report')printReport()
else if(act==='print-sheet')paper()
else if(act==='export')exportReport()
else if(act==='save-ai')saveAI()
else if(act==='test-ai')await testAI()
else if(act==='clear-ai'){aiKey='';state.aiBlocked=false;state.includeOpen=false;try{if(IN_EDUHUB)localStorage.removeItem('eduhub:groq-key');else sessionStorage.setItem('przyroda_groq_key','')}catch(e){}settings()}
else if(act==='reset-pool'){if(confirm('Odnowić pulę pytań sprawdzianowych? Historia wyników pozostanie bez zmian.')){saved.examUsed=[];persist();history()}}
else if(act==='reset'){if(confirm('Na pewno usunąć całą historię odpowiedzi w tej przeglądarce?')){saved.history=[];saved.examUsed=[];persist();history()}}
});
document.addEventListener('change',e=>{let el=e.target,act=el.dataset.change;if(act==='includeOpen'){state.includeOpen=el.checked;if(el.checked&&(!aiKey||navigator.onLine===false)){state.includeOpen=false;home()}}
else if(act==='pair'){state.pairs[+el.dataset.idx]=el.value;if(!el.value)delete state.pairs[+el.dataset.idx];renderQuiz(false)}});
document.addEventListener('input',e=>{if(e.target.id==='openanswer'){state.essay=e.target.value;const b=$('#check');if(b)b.disabled=state.essay.trim().length<3}});
let dragSource=null;document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-drop]');if(!row||currentEntry())return;dragSource=+row.dataset.drop;e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault()});document.addEventListener('drop',e=>{const row=e.target.closest('[data-drop]');if(!row||dragSource===null||currentEntry())return;e.preventDefault();let dest=+row.dataset.drop,el=state.sequence.splice(dragSource,1)[0];state.sequence.splice(dest,0,el);dragSource=null;renderQuiz(false)});
window.addEventListener('afterprint',()=>document.body.classList.remove('printing-sheet'));
window.addEventListener('online',()=>{if(state.view==='home')home()});window.addEventListener('offline',()=>{if(state.view==='home')home()});
home();
</script>
</body>
</html>

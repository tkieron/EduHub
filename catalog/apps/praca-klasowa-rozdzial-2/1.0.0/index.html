<script id="question-data" type="application/json">[{"id":"voice-01","topic":"voice","type":"choice","prompt":"Jak nazywamy osobę, która wypowiada się w tym wierszu?","hint":"Zwróć uwagę, że czytasz wiersz.","explanation":"Osobę wypowiadającą się w wierszu nazywamy podmiotem mówiącym.","difficulty":1,"passage":"Buduję z piasku małą wieżę,\na wiatr wygładza każdą ścianę.","options":["Narrator","Podmiot mówiący","Bohater opowiadania"],"answer":1},{"id":"voice-02","topic":"voice","type":"choice","prompt":"Jak nazywamy tego, kto opowiada o wydarzeniach w podanym opowiadaniu?","hint":"Pomyśl o nazwie tego, kto przedstawia wydarzenia w opowiadaniu.","explanation":"O wydarzeniach w opowiadaniu opowiada narrator.","difficulty":1,"passage":"Igor wsunął klucz do zamka.\nZa drzwiami zaszurały łapy psa.","options":["Bohater dialogu","Podmiot mówiący","Narrator"],"answer":2},{"id":"voice-03","topic":"voice","type":"choice","prompt":"W jakiej osobie narrator opowiada o sobie?","hint":"Sprawdź, do kogo odnosi się słowo „wsunęłam”.","explanation":"Forma „wsunęłam” odnosi się do narratorki. Można dodać do niej słowo „ja”.","difficulty":1,"passage":"Wsunęłam mapę do plecaka.\nNa przystanku poczekałam na Lenę.","options":["W pierwszej osobie","W drugiej osobie","W trzeciej osobie"],"answer":0},{"id":"voice-04","topic":"voice","type":"choice","prompt":"W jakiej osobie narrator opowiada o Lenie?","hint":"Zastąp imię Leny słowem „ja”, „ty” albo „ona” i sprawdź, które pasuje.","explanation":"O Lenie można powiedzieć „ona weszła”. To trzecia osoba.","difficulty":1,"passage":"Lena weszła na strych.\nPod oknem zauważyła zakurzone pudełko.","options":["W pierwszej osobie","W drugiej osobie","W trzeciej osobie"],"answer":2},{"id":"voice-05","topic":"voice","type":"choice","prompt":"Które słowo pokazuje, że podmiot mówiący opowiada o sobie?","hint":"Poszukaj słowa, przed którym można dodać „ja”.","explanation":"Forma „zobaczę” oznacza „ja zobaczę” i wskazuje na pierwszą osobę.","difficulty":2,"passage":"Nad dachem gaśnie złoty blask,\nlecz jutro znów zobaczę świt.","options":["blask","gaśnie","zobaczę","nad"],"answer":2},{"id":"voice-06","topic":"voice","type":"multi","prompt":"Zaznacz wszystkie formy czasownika, które pokazują, że narrator opowiada o sobie.","hint":"Sprawdź, przy których czynnościach możesz powiedzieć „ja”.","explanation":"W formach „wskoczyłem” i „pomachałem” słychać pierwszą osobę.","difficulty":2,"passage":"Wskoczyłem do tramwaju.\nGdy ruszył, pomachałem babci, która stała na przystanku.","options":["wskoczyłem","ruszył","pomachałem","stała"],"answers":[0,2]},{"id":"voice-07","topic":"voice","type":"multi","prompt":"Które dwa słowa pokazują, że podmiot mówiący mówi o swoich czynnościach?","hint":"Szukaj czynności, które wykonuje osoba wypowiadająca się w wierszu.","explanation":"Podmiot mówiący informuje o sobie formami „zbieram” i „chowam”.","difficulty":2,"passage":"Las szumi, pod sosnami rosną grzyby.\nZbieram szyszki i chowam je do kieszeni.","options":["szumi","zbieram","rosną","chowam"],"answers":[1,3]},{"id":"voice-08","topic":"voice","type":"choice","prompt":"Czego można dowiedzieć się o podmiocie mówiącym?","hint":"Zwróć uwagę na czynność opisaną w pierwszym wersie.","explanation":"Słowa „rysuję kredą” wskazują czynność podmiotu mówiącego.","difficulty":2,"passage":"Rysuję kredą fale na chodniku,\na w każdej fali płynie mały ślad.","options":["Rysuje kredą","Idzie do biblioteki","Przynosi komuś bukiet"],"answer":0},{"id":"voice-09","topic":"voice","type":"choice","prompt":"Kto wykonuje opisaną czynność w pierwszym zdaniu?","hint":"Ustal, do kogo odnosi się czasownik „zamknąłem”.","explanation":"Narrator mówi „zamknąłem”, więc opisuje własną czynność.","difficulty":2,"passage":"Zamknąłem furtkę.\nPani Irena odebrała ode mnie smycz i zawołała psa.","options":["Pani Irena","Narrator","Pies"],"answer":1},{"id":"voice-10","topic":"voice","type":"choice","prompt":"Która postać opowiada o wydarzeniu?","hint":"Znajdź czynność opowiedzianą w pierwszej osobie.","explanation":"Z formy „podałam” wynika, że narratorka podała Kubie latarkę.","difficulty":2,"passage":"Podałam Kubie latarkę.\nRuszył po schodach, które rano naprawiał Ibrahim.","options":["Kuba","Osoba, która podała Kubie latarkę","Osoba, która naprawiała schody"],"answer":1},{"id":"voice-11","topic":"voice","type":"choice","prompt":"Czego podmiot mówiący szuka w wierszu?","hint":"Odszukaj czasownik w pierwszej osobie i przeczytaj jego dalszy ciąg.","explanation":"Podmiot mówiący wprost mówi „szukam pióra”.","difficulty":2,"passage":"Na ścieżce leży dębowy liść.\nMiędzy kamieniami szukam pióra.","options":["Pióra","Dębowego liścia","Kamienia"],"answer":0},{"id":"voice-12","topic":"voice","type":"choice","prompt":"Co można ustalić o podmiocie mówiącym na podstawie tych wersów?","hint":"Wybierz informację, którą można wskazać w tekście.","explanation":"Wiersz podaje, że podmiot mówiący lubi poranne spacery.","difficulty":3,"passage":"Lubię poranne spacery,\ngdy cienie drzew sięgają daleko.","options":["Ma na imię Ada","Ma dziesięć lat","Lubi poranne spacery"],"answer":2},{"id":"voice-13","topic":"voice","type":"choice","prompt":"Który fragment pokazuje, że narrator bierze udział w wydarzeniach?","hint":"Znajdź własną czynność narratorki.","explanation":"„Otworzyłam parasol” przedstawia czynność narratorki jako uczestniczki wydarzenia.","difficulty":3,"passage":"Padał deszcz. Otworzyłam parasol.\nMarek podbiegł do furtki.","options":["Padał deszcz.","Otworzyłam parasol.","Marek podbiegł do furtki."],"answer":1},{"id":"voice-14","topic":"voice","type":"choice","prompt":"Które zdanie samodzielnie pokazuje, że narrator opowiada o sobie?","hint":"Porównaj formy czasownika w trzech zdaniach.","explanation":"Forma „schowałem” wskazuje na pierwszą osobę. Opowiadający mówi o swojej czynności.","difficulty":3,"options":["Okno było otwarte.","Franek cicho gwizdnął.","Schowałem kartkę do szuflady."],"answer":2},{"id":"voice-15","topic":"voice","type":"multi","prompt":"Zaznacz bezpośredni zwrot do wiatru oraz pełną prośbę skierowaną do niego.","hint":"Znajdź wyrażenie, którym podmiot mówiący przywołuje wiatr. Potem przeczytaj słowa skierowane do wiatru.","explanation":"„Wietrze” przywołuje adresata. „Unieś go nad drzewa” to pełna prośba skierowana do niego.","difficulty":3,"passage":"Na łące czekam z latawcem.\nWietrze, unieś go nad drzewa.","options":["Wietrze","Na łące","unieś go nad drzewa","czekam z latawcem"],"answers":[0,2]},{"id":"voice-16","topic":"voice","type":"match","prompt":"Dopasuj określenie do każdej z dwóch ról.","hint":"Pomyśl, jak nazywamy osobę, która mówi w wierszu, i tę, która opowiada w opowiadaniu.","explanation":"W wierszu wyróżniamy podmiot mówiący. W opowiadaniu wydarzenia przedstawia narrator.","difficulty":2,"rows":[{"label":"Osoba wypowiadająca się w wierszu","answer":"podmiot mówiący"},{"label":"Osoba opowiadająca o wydarzeniach w opowiadaniu","answer":"narrator"}]},{"id":"voice-17","topic":"voice","type":"fields","prompt":"Określ osobę narracji w obu krótkich fragmentach.","hint":"Do każdego fragmentu dopasuj „ja” albo „ona”.","explanation":"„Zatrzymałam się” to pierwsza osoba. „Zosia stanęła” to trzecia osoba.","difficulty":2,"passage":"A. Zatrzymałam się na końcu mostu.\nB. Zosia stanęła nad brzegiem rzeki.","fields":[{"label":"Fragment A","answers":["pierwsza osoba"],"options":["pierwsza osoba","druga osoba","trzecia osoba"]},{"label":"Fragment B","answers":["trzecia osoba"],"options":["pierwsza osoba","druga osoba","trzecia osoba"]}]},{"id":"voice-18","topic":"voice","type":"fields","prompt":"Wypisz jedną formę czasownika, która pokazuje, że podmiot mówiący mówi o sobie.","hint":"Poszukaj form czasownika, które da się połączyć ze słowem „ja”.","explanation":"Formy „nasłuchuję” i „czekam” odnoszą się do osoby wypowiadającej się w wierszu.","difficulty":3,"passage":"Nasłuchuję w ciszy drzew,\nczekam na pierwszy ptasi śpiew.","fields":[{"label":"Jedno słowo z wiersza","answers":["nasłuchuję","czekam"]}]},{"id":"noun-01","topic":"noun","type":"multi","prompt":"Zaznacz wszystkie rzeczowniki w zdaniu.","hint":"Szukaj nazw zwierzęcia, przedmiotu i rośliny.","explanation":"Rzeczownikami są „wiewiórka”, „orzech” i „drzewem”. Każdy z nich coś nazywa.","difficulty":1,"passage":"Wiewiórka znalazła orzech pod drzewem.","options":["Wiewiórka","znalazła","orzech","pod","drzewem"],"answers":[0,2,4]},{"id":"noun-02","topic":"noun","type":"multi","prompt":"Zaznacz wszystkie rzeczowniki w zdaniu.","hint":"Wskaż nazwę zwierzęcia i nazwę miejsca.","explanation":"„Pies” i „park” to rzeczowniki. Nazywają zwierzę i miejsce.","difficulty":1,"passage":"Mały pies biegnie przez park.","options":["Mały","pies","biegnie","przez","park"],"answers":[1,4]},{"id":"noun-03","topic":"noun","type":"choice","prompt":"W którym zestawie wszystkie wyrazy są rzeczownikami?","hint":"Sprawdź, czy każdy wyraz coś nazywa i odpowiada na pytanie „kto?” lub „co?”.","explanation":"„Domek”, „dziewczynka” i „jabłko” to nazwy, które są rzeczownikami.","difficulty":1,"options":["smok, fruwa, pióro","cicho, las, dzwonek","domek, dziewczynka, jabłko"],"answer":2},{"id":"noun-04","topic":"noun","type":"choice","prompt":"Który wyraz nazywa uczucie i jest rzeczownikiem?","hint":"Szukaj nazwy, do której pasuje pytanie „co?”.","explanation":"„Radość” nazywa uczucie. Można zapytać „co czuję?”.","difficulty":1,"options":["radość","wesoły","płacze","spokojnie"],"answer":0},{"id":"noun-05","topic":"noun","type":"choice","prompt":"Jaki rodzaj ma rzeczownik „serce”?","hint":"Przymierz „ten”, „ta” i „to”.","explanation":"Mówimy „to serce”, więc rzeczownik ma rodzaj nijaki.","difficulty":1,"options":["męski","żeński","nijaki"],"answer":2},{"id":"noun-06","topic":"noun","type":"choice","prompt":"Jaki rodzaj ma rzeczownik „cień”?","hint":"Który wyraz pasuje przed „cień” w wyrażeniu „… cień”?","explanation":"Mówimy „ten cień”, więc rzeczownik ma rodzaj męski.","difficulty":1,"options":["żeński","męski","nijaki"],"answer":1},{"id":"noun-07","topic":"noun","type":"choice","prompt":"Jaki rodzaj ma rzeczownik „kolega”?","hint":"Sprawdź, czy pasuje „ten”, „ta” czy „to”.","explanation":"Mówimy „ten kolega”. Rzeczownik „kolega” ma rodzaj męski mimo końcowego „a”.","difficulty":2,"passage":"Mój kolega przyniósł komiks.","options":["męski","żeński","nijaki"],"answer":0},{"id":"noun-08","topic":"noun","type":"choice","prompt":"Jaki rodzaj ma rzeczownik „kierowca” w podanym zdaniu?","hint":"Jakiego słowa użyjesz przed rzeczownikiem „kierowca” w tym zdaniu?","explanation":"W tym zdaniu pasuje „ten kierowca”. Forma „zatrzymał” też wskazuje na rodzaj męski.","difficulty":2,"passage":"Kierowca zatrzymał autobus.","options":["nijaki","męski","żeński"],"answer":1},{"id":"noun-09","topic":"noun","type":"choice","prompt":"Jaki rodzaj ma rzeczownik „noc”?","hint":"Połącz „noc” z jednym ze słów „ten”, „ta”, „to”.","explanation":"Mówimy „ta noc”, więc rzeczownik ma rodzaj żeński.","difficulty":2,"options":["męski","nijaki","żeński"],"answer":2},{"id":"noun-10","topic":"noun","type":"fields","prompt":"Uzupełnij liczbę pojedynczą i mnogą.","hint":"Wyobraź sobie najpierw jeden przedmiot, a potem kilka przedmiotów tego samego rodzaju.","explanation":"Jedna łyżwa, dwie łyżwy. Jedna narta, dwie narty.","difficulty":1,"fields":[{"label":"Liczba pojedyncza od „łyżwy”","answers":["łyżwa"]},{"label":"Liczba mnoga od „narta”","answers":["narty"]}]},{"id":"noun-11","topic":"noun","type":"choice","prompt":"Który z podanych rzeczowników ma liczbę mnogą w zdaniu?","hint":"Wskaż formę, którą nazwiesz kilka takich samych przedmiotów.","explanation":"„Kredki” to liczba mnoga. O jednej mówimy „kredka”.","difficulty":1,"options":["kosz","kredki","biurko","zeszyt"],"answer":1,"passage":"Pod oknem stoją kosz i biurko. Na biurku leżą zeszyt i kredki."},{"id":"noun-12","topic":"noun","type":"fields","prompt":"Zmień liczbę każdego rzeczownika. Podaj formy, które odpowiadają na pytanie „kto?” lub „co?”.","hint":"Sprawdź, jak brzmią pełne określenia z „jedno” i „kilkoro” lub „jeden” i „wielu”.","explanation":"Jedno dziecko, kilkoro dzieci. Jeden człowiek, wielu ludzi. W mianowniku liczby mnogiej mówimy „dzieci” i „ludzie”.","difficulty":2,"fields":[{"label":"Liczba mnoga od „dziecko”","answers":["dzieci"]},{"label":"Liczba pojedyncza od „ludzie”","answers":["człowiek"]}]},{"id":"noun-13","topic":"noun","type":"fields","prompt":"Podaj rodzaj każdego rzeczownika.","hint":"Dopasuj słowa „ten”, „ta” i „to”.","explanation":"Mówimy „ta książka”, „to lustro” i „ten plecak”.","difficulty":2,"fields":[{"label":"książka","answers":["żeński"],"options":["męski","żeński","nijaki"]},{"label":"lustro","answers":["nijaki"],"options":["męski","żeński","nijaki"]},{"label":"plecak","answers":["męski"],"options":["męski","żeński","nijaki"]}]},{"id":"noun-14","topic":"noun","type":"match","prompt":"Dopasuj do każdej formy w liczbie pojedynczej jej liczbę mnogą.","hint":"Spróbuj nazwać dwa takie same przedmioty lub części ciała.","explanation":"W liczbie mnogiej mówimy „uszy”, „jabłka”, „ręce” i „zęby”.","difficulty":2,"rows":[{"label":"ucho (część ciała)","answer":"uszy"},{"label":"jabłko","answer":"jabłka"},{"label":"ręka","answer":"ręce"},{"label":"ząb","answer":"zęby"}]},{"id":"noun-15","topic":"noun","type":"multi","prompt":"Zaznacz wszystkie rzeczowniki, które występują w liczbie mnogiej w podanym fragmencie.","hint":"Sprawdź, które wyrazy pasują, gdy tych rzeczy lub zwierząt jest kilka.","explanation":"„Ptaki”, „gałęzie” i „pióra” to formy liczby mnogiej.","difficulty":2,"options":["ptaki","gniazdo","gałęzie","liść","pióra"],"answers":[0,2,4],"passage":"Ptaki budują gniazdo. Przynoszą gałęzie i pióra, a później dokładają liść."},{"id":"noun-16","topic":"noun","type":"choice","prompt":"Jak można odmieniać rzeczownik „zeszyt”?","hint":"Porównaj „zeszyt”, „zeszytem” i „zeszyty”.","explanation":"„Zeszyt” odmienia się przez przypadki i liczby. Ma rodzaj męski.","difficulty":3,"options":["Przez rodzaje","Przez osoby i czasy","Przez przypadki i liczby"],"answer":2},{"id":"noun-17","topic":"noun","type":"choice","prompt":"W której parze podano dwie formy tego samego rzeczownika?","hint":"Szukaj pary, w której zmienia się forma wyrazu, a jego znaczenie pozostaje takie samo.","explanation":"„Rower” i „rowerem” to formy rzeczownika „rower” w różnych przypadkach.","difficulty":3,"options":["sąsiad – sąsiadka","rower – rowerem","kot – kotka"],"answer":1},{"id":"noun-18","topic":"noun","type":"multi","prompt":"Zaznacz wszystkie rzeczowniki. Zwróć uwagę, że mogą też nazywać zjawiska i cechy.","hint":"Sprawdź, do których wyrazów możesz zadać pytanie „co?”.","explanation":"„Burza” i „deszcz” nazywają zjawiska, a „odwaga” nazywa cechę. Wszystkie trzy to rzeczowniki.","difficulty":3,"options":["burza","głośny","odwaga","skacze","deszcz"],"answers":[0,2,4]},{"id":"case-01","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „motyl” w tym zdaniu?","hint":"Zapytaj, kto usiadł na płocie.","explanation":"Kto usiadł na płocie? Motyl. W tym zdaniu „motyl” występuje w mianowniku.","difficulty":1,"passage":"Motyl usiadł na płocie.","options":["dopełniacz","mianownik","biernik"],"answer":1},{"id":"case-02","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „klucza” w tym zdaniu?","hint":"Zadaj pytanie, zaczynając od „nie ma”.","explanation":"Czego nie ma w szufladzie? Klucza. To dopełniacz.","difficulty":1,"passage":"W szufladzie nie ma klucza.","options":["celownik","biernik","dopełniacz"],"answer":2},{"id":"case-03","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „mamie” w tym zdaniu?","hint":"Zapytaj, do kogo trafiła podana herbata, używając czasownika „podał”.","explanation":"Komu Olek podał herbatę? Mamie. To celownik.","difficulty":1,"passage":"Olek podał mamie herbatę.","options":["celownik","dopełniacz","miejscownik"],"answer":0},{"id":"case-04","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „lunetę” w tym zdaniu?","hint":"Zapytaj o rzecz, którą ustawiła Sara.","explanation":"Co ustawiła Sara? Lunetę. Wyraz „lunetę” jest tutaj w bierniku.","difficulty":1,"passage":"Sara ustawiła lunetę.","options":["mianownik","biernik","dopełniacz"],"answer":1},{"id":"case-05","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „kredą” w tym zdaniu?","hint":"Zadaj pytanie o przedmiot użyty do rysowania.","explanation":"Czym Mikołaj narysował strzałkę? Kredą. To narzędnik.","difficulty":1,"passage":"Mikołaj narysował strzałkę kredą.","options":["narzędnik","miejscownik","celownik"],"answer":0},{"id":"case-06","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „moście” w tym zdaniu?","hint":"Przy pytaniu o temat rozmowy zachowaj przyimek „o”.","explanation":"O czym rozmawialiśmy? O moście. „Moście” jest tu w miejscowniku.","difficulty":1,"passage":"Rozmawialiśmy o moście.","options":["wołacz","narzędnik","miejscownik"],"answer":2},{"id":"case-07","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „Tato” w tym zdaniu?","hint":"Zwróć uwagę, jak osoba mówiąca zwraca się do taty.","explanation":"„Tato” to bezpośredni zwrot do taty. W tym zdaniu jest w wołaczu.","difficulty":1,"passage":"Tato, zobacz moje zdjęcie!","options":["wołacz","mianownik","celownik"],"answer":0},{"id":"case-08","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „Sowy” w tym zdaniu?","hint":"Sprawdź, kto poluje nocą.","explanation":"Kto poluje nocą? Sowy. Tutaj „sowy” występują w mianowniku liczby mnogiej.","difficulty":2,"passage":"Sowy polują nocą.","options":["biernik","dopełniacz","mianownik"],"answer":2},{"id":"case-09","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „sów” w tym zdaniu?","hint":"Ułóż pytanie z wyrażeniem „nie słyszeliśmy”.","explanation":"Kogo nie słyszeliśmy? Sów. To dopełniacz liczby mnogiej.","difficulty":2,"passage":"Nie słyszeliśmy sów.","options":["dopełniacz","miejscownik","biernik"],"answer":0},{"id":"case-10","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „sowom” w tym zdaniu?","hint":"Ustal, komu w polowaniu pomaga ciemność.","explanation":"Komu sprzyja ciemność? Sowom. To celownik liczby mnogiej.","difficulty":2,"passage":"Ciemność sprzyja sowom podczas polowania.","options":["miejscownik","celownik","narzędnik"],"answer":1},{"id":"case-11","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „sowy” w tym zdaniu?","hint":"Ułóż pytanie o zwierzęta, które widzieliśmy.","explanation":"Kogo widzieliśmy? Sowy. Tutaj „sowy” występują w bierniku liczby mnogiej.","difficulty":2,"passage":"W lesie widzieliśmy sowy.","options":["mianownik","celownik","biernik"],"answer":2},{"id":"case-12","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „sowami” w tym zdaniu?","hint":"Zapytaj, kim się zaopiekowaliśmy.","explanation":"Kim się zaopiekowaliśmy? Sowami. „Sowami” to narzędnik liczby mnogiej.","difficulty":2,"passage":"Zaopiekowaliśmy się rannymi sowami.","options":["narzędnik","dopełniacz","celownik"],"answer":0},{"id":"case-13","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „sowach” w tym zdaniu?","hint":"Szukaj wyrażenia, które mówi, o kim opowiedziała Tosia.","explanation":"O kim opowiedziała Tosia? O sowach. „Sowach” to miejscownik liczby mnogiej.","difficulty":2,"passage":"Tosia opowiedziała nam o sowach.","options":["dopełniacz","miejscownik","celownik"],"answer":1},{"id":"case-14","topic":"case","type":"choice","prompt":"W którym przypadku występuje słowo „Drużyny” w tym zdaniu?","hint":"Sprawdź, do kogo kierowane jest polecenie.","explanation":"„Drużyny” to bezpośredni zwrot do osób z kilku drużyn. Tutaj to wołacz liczby mnogiej.","difficulty":2,"passage":"Drużyny, ustawcie się przy linii!","options":["wołacz","biernik","mianownik"],"answer":0},{"id":"case-15","topic":"case","type":"match","prompt":"Dopasuj parę pytań do przypadku wyróżnionego rzeczownika.","hint":"W każdym zdaniu ułóż pytanie, na które odpowiada wskazany rzeczownik.","explanation":"Wybierając pytanie, bierzemy pod uwagę rolę rzeczownika w zdaniu.","difficulty":2,"rows":[{"label":"Mianownik • Wiśnie rosną w sadzie. Rzeczownik „wiśnie”.","answer":"kto? co?"},{"label":"Dopełniacz • W koszu nie ma wiśni. Rzeczownik „wiśni”.","answer":"kogo? czego?"},{"label":"Celownik • Daję psu smakołyk. Rzeczownik „psu”.","answer":"komu? czemu?"},{"label":"Biernik • Widzę smakołyk. Rzeczownik „smakołyk”.","answer":"kogo? co?"}]},{"id":"case-16","topic":"case","type":"match","prompt":"Dopasuj przypadek do rzeczownika w każdym zdaniu.","hint":"Szukaj odpowiedzi na pytanie „z kim?” lub „o kim?”. Sprawdź też, czy ktoś się do kogoś zwraca.","explanation":"„Z psem” zawiera narzędnik, „o psie” miejscownik, a „piesku” w tym zdaniu to wołacz.","difficulty":2,"rows":[{"label":"Idę z psem. Rzeczownik „psem”.","answer":"narzędnik"},{"label":"Czytam o psie. Rzeczownik „psie”.","answer":"miejscownik"},{"label":"Piesku, wracaj! Rzeczownik „piesku”.","answer":"wołacz"}]},{"id":"case-17","topic":"case","type":"fields","prompt":"Wpisz formę rzeczownika „latarka” w liczbie pojedynczej, która pasuje do każdego zdania.","hint":"Przeczytaj zdania z pytaniami „Co leży obok mapy?” i „Czego nie ma w plecaku?”.","explanation":"Co leży obok mapy? Latarka. Czego nie ma w plecaku? Latarki.","difficulty":1,"passage":"A. ___ leży obok mapy.\nB. W plecaku nie ma ___.","fields":[{"label":"Zdanie A • mianownik","answers":["latarka"]},{"label":"Zdanie B • dopełniacz","answers":["latarki"]}]},{"id":"case-18","topic":"case","type":"fields","prompt":"Wpisz formę rzeczownika „chomik” w liczbie pojedynczej, która pasuje do każdego zdania.","hint":"Zapytaj, komu daliśmy ziarno i kogo oglądamy.","explanation":"Komu daliśmy ziarno? Chomikowi. Kogo oglądamy? Chomika.","difficulty":2,"passage":"A. Daliśmy ___ ziarno.\nB. Oglądamy ___.","fields":[{"label":"Zdanie A • celownik","answers":["chomikowi"]},{"label":"Zdanie B • biernik","answers":["chomika"]}]},{"id":"case-19","topic":"case","type":"fields","prompt":"Wpisz formę rzeczownika „pędzel” w liczbie pojedynczej, która pasuje do każdego zdania.","hint":"Zapytaj, czym maluje Pola i o czym opowiadała.","explanation":"Czym Pola maluje? Pędzlem. O czym opowiadała? O pędzlu.","difficulty":2,"passage":"A. Pola maluje akwarelę ___.\nB. Opowiadała mi o swoim ___.","fields":[{"label":"Zdanie A • narzędnik","answers":["pędzlem"]},{"label":"Zdanie B • miejscownik","answers":["pędzlu"]}]},{"id":"case-20","topic":"case","type":"fields","prompt":"Wpisz imię „Zosia” w formie, która pasuje do każdego zdania.","hint":"Zauważ, gdzie ktoś zwraca się bezpośrednio do Zosi.","explanation":"W zdaniu A „Zosiu” jest bezpośrednim zwrotem. W zdaniu B „Zosia” odpowiada na pytanie „kto otworzy okno?”.","difficulty":2,"passage":"A. ___, otwórz okno!\nB. ___ otworzy okno po lekcji.","fields":[{"label":"Zdanie A • wołacz","answers":["Zosiu"]},{"label":"Zdanie B • mianownik","answers":["Zosia"]}]},{"id":"case-21","topic":"case","type":"fields","prompt":"Uzupełnij luki formami rzeczownika „plecak” w liczbie mnogiej.","hint":"Przeczytaj każde zdanie, pamiętając, że chodzi o kilka plecaków.","explanation":"Nie ma czego? Plecaków. Rozmawiamy o czym? O plecakach.","difficulty":2,"passage":"A. Na wieszakach nie ma ___.\nB. Rozmawiamy o ___ na wycieczkę.","fields":[{"label":"Zdanie A • dopełniacz","answers":["plecaków"]},{"label":"Zdanie B • miejscownik","answers":["plecakach"]}]},{"id":"case-22","topic":"case","type":"fields","prompt":"Uzupełnij luki formami rzeczownika „dziecko” w liczbie mnogiej.","hint":"Zapytaj, kto stoi i komu opiekun podał jabłka.","explanation":"Kto stoi pod drzewem? Dzieci. Komu podał jabłka? Dzieciom.","difficulty":2,"passage":"A. ___ stoją pod drzewem.\nB. Opiekun podał ___ jabłka.","fields":[{"label":"Zdanie A • mianownik","answers":["dzieci"]},{"label":"Zdanie B • celownik","answers":["dzieciom"]}]},{"id":"case-23","topic":"case","type":"fields","prompt":"Podaj przypadek i liczbę rzeczownika „lodami”.","hint":"Zapytaj, czym częstował Szymon. Porównaj formy „lodem” i „lodami”.","explanation":"Czym częstował Szymon? Lodami. „Lodami” jest w narzędniku liczby mnogiej.","difficulty":3,"passage":"Szymon częstował nas lodami.","fields":[{"label":"Przypadek","answers":["narzędnik"],"options":["mianownik","celownik","biernik","narzędnik","miejscownik"]},{"label":"Liczba","answers":["mnoga"],"options":["pojedyncza","mnoga"]}]},{"id":"case-24","topic":"case","type":"fields","prompt":"Wskaż przypadek rzeczownika „piórko” w każdym zdaniu.","hint":"Zwróć uwagę, w którym zdaniu piórko samo spadło, a w którym ktoś je podniósł.","explanation":"„Co spadło?” wskazuje tu mianownik. „Co podniosła Lena?” wskazuje biernik. Obie formy brzmią „piórko”.","difficulty":3,"passage":"A. Piórko spadło na podłogę.\nB. Lena podniosła piórko.","fields":[{"label":"Zdanie A","answers":["mianownik"],"options":["mianownik","dopełniacz","celownik","biernik","narzędnik","miejscownik","wołacz"]},{"label":"Zdanie B","answers":["biernik"],"options":["mianownik","dopełniacz","celownik","biernik","narzędnik","miejscownik","wołacz"]}]},{"id":"case-25","topic":"case","type":"fields","prompt":"Wskaż przypadek i liczbę rzeczownika „gruszki” w każdym zdaniu.","hint":"Zwróć uwagę na „ani jednej” oraz na to, do czego odnosi się słowo „dojrzewają”.","explanation":"Czego nie ma? Ani jednej gruszki, czyli dopełniacz liczby pojedynczej. Co dojrzewa? Gruszki, czyli mianownik liczby mnogiej.","difficulty":3,"passage":"A. W misce nie ma ani jednej gruszki.\nB. Gruszki dojrzewają w sadzie.","fields":[{"label":"Zdanie A • przypadek","answers":["dopełniacz"],"options":["mianownik","dopełniacz","celownik","biernik","narzędnik","miejscownik","wołacz"]},{"label":"Zdanie A • liczba","answers":["pojedyncza"],"options":["pojedyncza","mnoga"]},{"label":"Zdanie B • przypadek","answers":["mianownik"],"options":["mianownik","dopełniacz","celownik","biernik","narzędnik","miejscownik","wołacz"]},{"label":"Zdanie B • liczba","answers":["mnoga"],"options":["pojedyncza","mnoga"]}]},{"id":"case-26","topic":"case","type":"multi","prompt":"Zaznacz wszystkie zdania, w których występuje rzeczownik w wołaczu.","hint":"Znajdź zdania skierowane bezpośrednio do drugiej osoby.","explanation":"„Wujku” i „Kasiu” rozpoczynają bezpośrednie zwroty do osób.","difficulty":3,"options":["Wujku, przyjdź tu!","Wujek czeka w kuchni.","Kasiu, spójrz na tę chmurę!","Rozmawiam z Kasią."],"answers":[0,2]},{"id":"case-27","topic":"case","type":"multi","prompt":"Zaznacz wszystkie zdania, w których rzeczownika „zeszyt” użyto w bierniku.","hint":"W każdym zdaniu znajdź czasownik i sprawdź, na jakie pytanie odpowiada rzeczownik.","explanation":"Co schowałem? Zeszyt. Co oddałem? Zeszyt. W tych dwóch zdaniach rzeczownik jest w bierniku.","difficulty":3,"options":["Mój zeszyt leży na stoliku.","Schowałem zeszyt do torby.","Szukam zeszytu w szafce.","Oddałem Oli zeszyt po lekcji."],"answers":[1,3]},{"id":"case-28","topic":"case","type":"fields","prompt":"Uzupełnij zdania formami rzeczownika „pilot” w liczbie mnogiej. W obu zdaniach chodzi o osoby, które kierują samolotami.","hint":"W zdaniu A zapytaj „kogo poznałam?”. W zdaniu B zwróć się bezpośrednio do całej grupy.","explanation":"W A „pilotów” odpowiada na pytanie „kogo?”. W B „piloci” jest bezpośrednim zwrotem do grupy.","difficulty":3,"passage":"A. Poznałam ___ na lotnisku.\nB. Szanowni ___, podejdźcie do tablicy!","fields":[{"label":"Zdanie A • biernik","answers":["pilotów"]},{"label":"Zdanie B • wołacz","answers":["piloci"]}]},{"id":"capital-01","topic":"capital","type":"choice","prompt":"Która wersja imienia i nazwiska jest zapisana poprawnie?","hint":"Sprawdź pierwszą literę imienia i pierwszą literę nazwiska.","explanation":"Imiona i nazwiska zapisujemy wielką literą, stąd „Zofia Łuczak”.","difficulty":1,"options":["zofia Łuczak","Zofia Łuczak","Zofia łuczak"],"answer":1},{"id":"capital-02","topic":"capital","type":"choice","prompt":"Wybierz poprawny zapis zdania.","hint":"Wskaż nazwę konkretnego kota. Sprawdź też pisownię czasownika.","explanation":"Imię kota „Mruczek” piszemy wielką literą. Czasownik „śpi” wewnątrz zdania zaczynamy małą literą.","difficulty":1,"options":["Kot mruczek śpi na fotelu.","Kot Mruczek Śpi na fotelu.","Kot Mruczek śpi na fotelu."],"answer":2},{"id":"capital-03","topic":"capital","type":"choice","prompt":"Jak poprawnie zapisać imię i przydomek tego króla?","hint":"Sprawdź pierwszą literę imienia i pierwszą literę przydomka.","explanation":"„Kazimierz” to imię króla, a „Wielki” to jego przydomek. Oba wyrazy zaczynamy wielką literą.","difficulty":1,"passage":"Król Kazimierz nosił przydomek „wielki”.","options":["Kazimierz Wielki","Kazimierz wielki"],"answer":0},{"id":"capital-04","topic":"capital","type":"choice","prompt":"W którym zdaniu wyraz „burza” to imię konkretnego zwierzęcia?","hint":"Szukaj fragmentu, w którym ten wyraz wskazuje na konkretną klacz.","explanation":"„Burza” w zdaniu o klaczy to imię zwierzęcia. Nazwę zjawiska zapisujemy małą literą w środku zdania.","difficulty":1,"options":["Dziś nad lasem przeszła burza.","W zagrodzie stoi klacz Burza.","Po południu nadejdzie burza."],"answer":1},{"id":"capital-05","topic":"capital","type":"choice","prompt":"Wybierz poprawny zapis zdania z przezwiskiem.","hint":"Znajdź przezwisko tej jednej osoby. Zwróć też uwagę na zapis wyrazu „klasa”.","explanation":"Przezwisko „Bystrzak” zaczyna się wielką literą w każdej formie, także „Bystrzakiem”.","difficulty":2,"options":["W klasie nazywają Olka Bystrzakiem.","W klasie nazywają Olka bystrzakiem.","W Klasie nazywają Olka Bystrzakiem."],"answer":0},{"id":"capital-06","topic":"capital","type":"choice","prompt":"Wybierz poprawny zapis zdania z pseudonimem.","hint":"Wielką literę dobierz do nazwy zastępującej imię i nazwisko.","explanation":"Pseudonim „Wicherek” piszemy wielką literą. Wyraz „pseudonimem” w środku zdania piszemy małą literą.","difficulty":2,"options":["Oskar podpisuje opowiadania pseudonimem wicherek.","Oskar podpisuje opowiadania Pseudonimem Wicherek.","Oskar podpisuje opowiadania pseudonimem Wicherek."],"answer":2},{"id":"capital-07","topic":"capital","type":"multi","prompt":"Zaznacz wszystkie wyrazy, które wewnątrz zdania trzeba zacząć wielką literą.","hint":"Znajdź imię zwierzęcia oraz imię i nazwisko osoby.","explanation":"„Kropka” to imię psa, a „Wanda Kasprzak” to imię i nazwisko osoby.","difficulty":2,"passage":"Nasz pies ma na imię kropka. Jego opiekunka nazywa się wanda kasprzak.","options":["pies","kropka","wanda","opiekunka","kasprzak"],"answers":[1,2,4]},{"id":"capital-08","topic":"capital","type":"choice","prompt":"Który zapis tytułu wiersza jest poprawny?","hint":"Przeczytaj tytuł i sprawdź, które słowo go otwiera.","explanation":"Pierwszy wyraz tytułu „Zabawa w ogrodzie” zaczyna się wielką literą.","difficulty":1,"options":["zabawa w ogrodzie","Zabawa w ogrodzie","Zabawa w Ogrodzie"],"answer":1},{"id":"capital-09","topic":"capital","type":"choice","prompt":"W którym zapisie tytułu poprawnie użyto wielkich liter?","hint":"Sprawdź pierwszy wyraz i nazwę rzeki.","explanation":"W tytule „Wyprawa nad Wisłę” wielką literą piszemy pierwszy wyraz i nazwę rzeki.","difficulty":2,"options":["Wyprawa nad Wisłę","wyprawa nad Wisłę","Wyprawa Nad wisłę"],"answer":0},{"id":"capital-10","topic":"capital","type":"choice","prompt":"Wybierz poprawny zapis tytułu opowiadania o kocie.","hint":"Zwróć uwagę na pierwszy wyraz i imię zwierzęcia.","explanation":"Tytuł zaczynamy wielką literą. Wielką literę zachowuje również imię kota.","difficulty":2,"passage":"Kot ma na imię Mruczek, a tytuł opowiadania brzmi „wizyta u mruczka”.","options":["Wizyta u mruczka","Wizyta u Mruczka","Wizyta U Mruczka"],"answer":1},{"id":"capital-11","topic":"capital","type":"fields","prompt":"Przepisz zdanie. Popraw wielkie litery w imieniu i naz <script id="learning-core">(() => {
  'use strict';

  const examQuotas = { voice: 5, noun: 4, case: 7, capital: 5, quote: 4 };
  const allTopics = Object.keys(examQuotas);

  function normalize(value, strictCase = false) {
    const text = String(value ?? '')
      .normalize('NFC')
      .replace(/[„“”‟«»]/gu, '"')
      .replace(/\p{Dash_Punctuation}/gu, '-')
      .replace(/\s+/gu, ' ')
      .trim();
    return strictCase ? text : text.toLocaleLowerCase('pl-PL');
  }

  function initialValues(question) {
    switch (question.type) {
      case 'choice':
        return [''];
      case 'multi':
        return question.options.map(() => false);
      case 'fields':
        return question.fields.map(() => '');
      case 'match':
        return question.rows.map(() => '');
    }
  }

  function createAttempt(question) {
    const values = initialValues(question);
    return {
      values,
      marks: values.map(() => 'neutral'),
      phase: 'answer',
      checks: 0,
      hadError: false,
      revealed: false,
      done: false,
      score: null,
      hintUsed: false,
    };
  }

  function evaluate(question, values) {
    switch (question.type) {
      case 'choice':
        return [String(values[0] ?? '').trim() === String(question.answer)];
      case 'multi':
        return question.options.map((_, index) => values[index] === question.answers.includes(index));
      case 'fields':
        return question.fields.map(({ answers, strictCase }, index) => {
          const submitted = normalize(values[index], strictCase);
          return answers.some(answer => submitted === normalize(answer, strictCase));
        });
      case 'match':
        return question.rows.map(({ answer }, index) => normalize(values[index]) === normalize(answer));
    }
  }

  function check(question, attempt) {
    if (attempt.done) return attempt;

    const answered = question.type === 'multi'
      ? attempt.values.some(value => value === true)
      : attempt.marks.every((_, index) => String(attempt.values[index] ?? '').trim() !== '');
    if (!answered) return { ...attempt, validation: 'Uzupełnij wszystkie odpowiedzi.' };

    const correctSlots = evaluate(question, attempt.values);
    const done = correctSlots.every(Boolean);
    const marks = correctSlots.map((isCorrect, index) => {
      if (attempt.marks[index] === 'yellow') return 'yellow';
      return isCorrect ? 'green' : 'red';
    });

    let score = null;
    if (done && attempt.revealed) score = 0;
    else if (done) score = attempt.hadError ? 1 : 2;

    return {
      ...attempt,
      marks,
      phase: done ? 'resolved' : 'feedback',
      checks: attempt.checks + 1,
      hadError: attempt.hadError || !done,
      done,
      score,
      validation: '',
    };
  }

  function correct(question, attempt) {
    if (attempt.done || attempt.phase !== 'feedback') return attempt;

    const blankValues = initialValues(question);
    return {
      ...attempt,
      values: attempt.values.map((value, index) => attempt.marks[index] === 'red' ? blankValues[index] : value),
      marks: attempt.marks.map(mark => mark === 'red' ? 'neutral' : mark),
      phase: 'answer',
      validation: '',
    };
  }

  function reveal(question, attempt) {
    if (attempt.done) return attempt;

    let answers;
    switch (question.type) {
      case 'choice':
        answers = [question.answer];
        break;
      case 'multi':
        answers = question.options.map((_, index) => question.answers.includes(index));
        break;
      case 'fields':
        answers = question.fields.map(({ answers }) => answers[0]);
        break;
      case 'match':
        answers = question.rows.map(({ answer }) => answer);
        break;
    }

    return {
      ...attempt,
      values: answers.map((answer, index) => attempt.marks[index] === 'green' ? attempt.values[index] : answer),
      marks: attempt.marks.map(mark => mark === 'green' ? 'green' : 'yellow'),
      phase: 'resolved',
      hadError: true,
      revealed: true,
      done: true,
      score: 0,
      validation: '',
    };
  }

  function shuffle(items, rng) {
    for (let index = items.length - 1; index > 0; index--) {
      const swapIndex = Math.floor(rng() * (index + 1));
      [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
    }
    return items;
  }

  function drawBalanced(groups, limit) {
    const selected = [];
    while (selected.length < limit && groups.some(group => group.length > 0)) {
      for (const group of groups) {
        if (selected.length === limit) break;
        if (group.length > 0) selected.push(group.shift());
      }
    }
    return selected;
  }

  function selectQuestions(bank, { mode = 'training', topics = [], count = 10, ids = [], rng = Math.random } = {}) {
    const byId = new Map(bank.map(question => [question.id, question]));
    if (mode === 'retry') {
      return [...new Set(ids)].filter(id => byId.has(id)).map(id => byId.get(id));
    }

    const selectedTopics = mode === 'training' ? [...new Set(topics)] : allTopics;
    const uniqueQuestions = [...byId.values()];
    const groups = selectedTopics.map(topic => shuffle(uniqueQuestions.filter(question => question.topic === topic), rng));

    if (mode === 'exam') {
      const selected = groups.flatMap((group, index) => group.splice(0, examQuotas[allTopics[index]]));
      const extras = drawBalanced(shuffle(groups, rng), 25 - selected.length);
      return shuffle([...selected, ...extras], rng);
    }

    const limit = mode === 'adventure' ? 15 : Math.floor(count);
    return shuffle(drawBalanced(shuffle(groups, rng), limit), rng);
  }

  function summarize(records) {
    const retryIds = new Set();
    const byTopic = new Map();
    let total = 0;
    let score = 0;
    let firstTry = 0;
    let corrected = 0;
    let shown = 0;

    for (const record of records) {
      if (record.done === false || ![0, 1, 2].includes(record.score)) continue;
      total++;
      score += record.score;
      if (record.score === 2) firstTry++;
      if (record.score === 1) corrected++;
      if (record.revealed) shown++;
      if (record.hadError || record.revealed) retryIds.add(record.questionId);

      const topic = byTopic.get(record.topic) ?? { total: 0, score: 0, maxScore: 0 };
      topic.total++;
      topic.score += record.score;
      topic.maxScore += 2;
      byTopic.set(record.topic, topic);
    }

    const maxScore = total * 2;
    return {
      total,
      maxScore,
      score,
      percent: maxScore === 0 ? 0 : Math.round(score / maxScore * 100),
      firstTry,
      corrected,
      shown,
      retryIds: [...retryIds],
      byTopic: Object.fromEntries(byTopic),
    };
  }

  const learningCore = { normalize, initialValues, createAttempt, evaluate, check, correct, reveal, selectQuestions, summarize };
  globalThis.LearningCore = learningCore;
  if (typeof module !== 'undefined' && module.exports) module.exports = learningCore;
})();
</script>

function setAttempt(a){const ctx=current();if(!ctx)return;ctx.s.attempts[ctx.q.id]=a;save();}
function remember(q,a,exam=false){
 const s=state.active;if(s.records.some(r=>r.questionId===q.id))return;
 const score=exam?(a.done?2:0):a.score;
 const record={questionId:q.id,topic:q.topic,score,hadError:a.hadError,revealed:a.revealed,values:[...a.values]};s.records.push(record);
 if(!exam){state.best[q.id]=Math.max(Number(state.best[q.id])||0,score);state.xp+=score*10+(score===0?3:0);}save();
}
function checkAnswer(){const ctx=current();if(!ctx)return;const a=C.check(ctx.q,ctx.a);setAttempt(a);if(a.done){remember(ctx.q,a);playTone(a.score===2?'success':'ok');if(a.score===2)celebrate(12);}else if(!a.validation)playTone('try');renderRound();}
function correctAnswer(){const ctx=current();if(!ctx)return;setAttempt(C.correct(ctx.q,ctx.a));renderRound();const first=$('#answer-form input:not(:disabled),#answer-form select:not(:disabled),#answer-form textarea:not(:disabled)');first?.focus({preventScroll:true});}
function revealAnswer(){const ctx=current();if(!ctx)return;const a=C.reveal(ctx.q,ctx.a);setAttempt(a);remember(ctx.q,a);renderRound();}
function nextQuestion(){const s=state.active;if(!s)return;if(s.mode!=='exam'&&!current().a.done)return;if(s.cursor<s.ids.length-1){s.cursor++;save();renderRound(true);window.scrollTo(0,0);}else finishSession();}
function examNext(){const ctx=current();if(!ctx)return;const a=C.check(ctx.q,ctx.a);if(a.validation){setAttempt(a);renderRound();return;}setAttempt(a);remember(ctx.q,a,true);nextQuestion();}
function finishSession(){
 const s=state.active;if(!s)return;if(s.mode==='exam'){for(const r of s.records){state.best[r.questionId]=Math.max(Number(state.best[r.questionId])||0,r.score);state.xp+=r.score*10+(r.score===0?3:0);}}
 lastResult={...s,finishedAt:Date.now(),summary:C.summarize(s.records)};state.lastResult=lastResult;state.history.push({mode:s.mode,date:Date.now(),score:lastResult.summary.score,maxScore:lastResult.summary.maxScore});state.history=state.history.slice(-20);state.active=null;save();page='result';renderResult();window.scrollTo(0,0);playTone('finish');celebrate(28);
}
function formatAnswer(q,values){
 if(q.type==='choice')return plain(q.options[Number(values?.[0])]??'Brak odpowiedzi');
 if(q.type==='multi')return q.options.filter((_,i)=>values?.[i]).map(plain).join('; ')||'Nic nie zaznaczono';
 return (q.type==='fields'?q.fields:q.rows).map((f,i)=>`${f.label}: ${values?.[i]||'—'}`).join('\n');
}
function correctValues(q){if(q.type==='choice')return [q.answer];if(q.type==='multi')return q.options.map((_,i)=>q.answers.includes(i));if(q.type==='fields')return q.fields.map(f=>f.answers[0]);return q.rows.map(r=>r.answer);}

 $('#main').innerHTML=`<section class="results"><div class="result-hero"><div><div class="eyebrow">${modes[s.mode]} · runda ukończona</div><h1>${head}</h1><p>${message}</p></div><div class="score-ring" style="--percent:${sum.percent}"><div><b>${sum.percent}%</b><span>${sum.score} / ${sum.maxScore} pkt</span></div></div></div><div class="result-numbers"><div class="result-number"><strong>${sum.firstTry}</strong>Bezbłędnie od razu</div><div class="result-number"><strong>${exam?sum.retryIds.length:sum.corrected}</strong>${exam?'Do przećwiczenia':'Po własnej poprawie'}</div><div class="result-number"><strong>${exam?sum.total:sum.shown}</strong>${exam?'Zadań w próbie':'Odpowiedzi odkrytych'}</div></div><section class="result-section"><h2>Jak poszło w poszczególnych krainach?</h2>${TOPICS.filter(t=>sum.byTopic[t.id]).map(t=>{const v=sum.byTopic[t.id],percent=v.maxScore?100*v.score/v.maxScore:0;return `<div class="topic-result" style="${colors(t)}"><span>${t.short}</span><div class="mini-progress" aria-label="${Math.round(percent)} procent"><i style="width:${percent}%"></i></div><strong>${v.score}/${v.maxScore} pkt</strong></div>`;}).join('')}</section>${sum.retryIds.length?`<section class="retry-banner"><div><h3>Mała dogrywka, duży krok</h3><p>Zadania do przećwiczenia: ${sum.retryIds.length}. W dogrywce możesz korzystać ze wskazówek, poprawiania i odkrywania odpowiedzi.</p></div><button class="primary" data-action="retry">Przećwicz błędy</button></section>`:'<section class="retry-banner clean"><div><h3>Wszystko poprawnie za pierwszym razem!</h3><p>Ta runda nie wymaga dogrywki. Możesz odpocząć albo ruszyć po nowe wyzwania.</p></div><span aria-hidden="true" style="font-size:2.2rem">✦</span></section>'}<div class="result-actions"><button class="primary" data-action="home">Wracam na mapę</button><button class="secondary" data-action="export-report">Pobierz raport</button><button class="secondary" data-action="book">Otwórz pomocnik</button></div><section class="result-section"><h2>Twoje odpowiedzi i wyjaśnienia</h2><p class="answer-hint">W raporcie zapis *tekst* oznacza kursywę.</p><div class="report-list">${s.records.map((r,i)=>{const q=byId.get(r.questionId);if(!q)return '';return `<details class="report-item"><summary><b>${r.score}/2</b> · ${i+1}. ${esc(q.prompt)}</summary><div class="report-detail">${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}<p><b>Twoja odpowiedź:</b></p><span class="answer-report">${esc(formatAnswer(q,r.values))}</span><button class="text-button" data-action="report-answer" data-id="${q.id}">Pokaż rozwiązanie i wyjaśnienie</button><div class="invisible" id="report-${q.id}"><p><b>Poprawne rozwiązanie:</b></p><span class="answer-report correct-answer">${esc(formatAnswer(q,correctValues(q)))}</span><p style="margin-top:10px">${esc(q.explanation)}</p></div></div></details>`;}).join('')}</div></section></section>`;updateHeader();
}

const BOOK={
voice:`<h3>Kto mówi w tekście?</h3><p><b>Narrator</b> opowiada o wydarzeniach w utworze. Może brać w nich udział lub obserwować je z boku. Nie utożsamiamy go z autorem.</p><div class="book-example">„Wszedłem do klasy. Zobaczyłem Olę”.<br>Narrator uczestniczy w wydarzeniach. Wskazują na to słowa <b>wszedłem, zobaczyłem</b>.<br><br>„Ola weszła do klasy. Usiadła obok Tomka”.<br>Narrator opowiada o bohaterach z boku.</div><p><b>Podmiot mówiący</b> to osoba, która wypowiada się w wierszu. Wyraża uczucia, przeżycia, myśli i poglądy lub opisuje świat.</p><div class="book-example">„Wracamy po lecie, witamy swą klasę”.<br>Mówi grupa uczniów: wskazują na to <b>wracamy, witamy</b>.</div><p>Sprawdzaj, kto wypowiada dane słowa. Wypowiedź bohatera w dialogu nie musi być wypowiedzią narratora.</p>`,
noun:`<h3>Rzeczownik — kto? co?</h3><p>Nazywa osoby, zwierzęta, rośliny, rzeczy, miejsca, uczucia i zjawiska: <b>uczeń, kot, brzoza, książka, szkoła, radość, deszcz</b>.</p><p>Rzeczownik ma określony <b>rodzaj</b>. Najpierw sprowadź go do podstawowej formy w liczbie pojedynczej, a potem dodaj:</p><ul><li><b>ten</b> kot, kolega, kierowca — rodzaj męski;</li><li><b>ta</b> książka, radość — rodzaj żeński;</li><li><b>to</b> dziecko, okno — rodzaj nijaki.</li></ul><div class="book-example">z kolegą → <b>kolega</b> → <b>ten</b> kolega → rodzaj męski.<br>Końcówka -a nie oznacza automatycznie rodzaju żeńskiego.</div><p>Rzeczowniki odmieniają się przez <b>liczby i przypadki</b>. Nie odmieniają się przez rodzaje.</p>`,
case:`<h3>Siedem przypadków</h3><p>Zadaj pytanie do rzeczownika w konkretnym zdaniu. Pomocnicze słowa pomagają, ale liczy się sens całego zdania.</p><div class="table-scroll"><table><thead><tr><th>Przypadek</th><th>Pytania</th><th>Przykład</th></tr></thead><tbody><tr><td>Mianownik</td><td>kto? co?</td><td>Jest <b>książka</b>.</td></tr><tr><td>Dopełniacz</td><td>kogo? czego?</td><td>Nie ma <b>książki</b>.</td></tr><tr><td>Celownik</td><td>komu? czemu?</td><td>Przyglądam się <b>książce</b>.</td></tr><tr><td>Biernik</td><td>kogo? co?</td><td>Widzę <b>książkę</b>.</td></tr><tr><td>Narzędnik</td><td>z kim? z czym?</td><td>Idę z <b>książką</b>.</td></tr><tr><td>Miejscownik</td><td>o kim? o czym?</td><td>Mówię o <b>książce</b>.</td></tr><tr><td>Wołacz</td><td>o! (zwracam się)</td><td>Witaj, <b>książko</b>!</td></tr></tbody></table></div><div class="book-example"><b>Kot</b> śpi. → mianownik (kto śpi?)<br>Widzę <b>kota</b>. → biernik (kogo widzę?)<br>Nie ma <b>kota</b>. → dopełniacz (kogo nie ma?)</div><p>Ta sama forma może mieć różne przypadki. <b>Ucznia</b> w „Widzę ucznia” to biernik, a w „Nie ma ucznia” — dopełniacz.</p><p>Liczba pojedyncza: uczeń, ucznia, uczniowi…<br>Liczba mnoga: uczniowie, uczniów, uczniom…</p>`,
capital:`<h3>Kiedy użyć wielkiej litery?</h3><ul><li>Imiona i nazwiska: <b>Jan Brzechwa, Maria Skłodowska-Curie</b>.</li><li>Przydomki, pseudonimy i przezwiska: <b>Bolesław Chrobry, Sokole Oko</b>.</li><li>Imiona zwierząt i drzew: kot <b>Filemon</b>, dąb <b>Bartek</b>.</li><li>Tytuły książek, wierszy, filmów: <b>pierwszy wyraz</b> i występujące w środku <b>nazwy własne</b>.</li></ul><div class="book-example">„<b>D</b>zieci z <b>B</b>ullerbyn”<br>„<b>A</b>kademia pana <b>K</b>leksa”<br>„<b>W</b> pustyni i w puszczy”</div><p>Znaczenie zmienia zapis:</p><div class="book-example">Moja koleżanka <b>Róża</b> czyta książkę. — imię<br>W ogrodzie rośnie <b>róża</b>. — roślina</div><p>W zadaniach z pisowni wielkość liter ma znaczenie. Przepisz dokładnie podane słowa, poprawiając zapis.</p>`,
quote:`<h3>Cudzysłów czy kursywa?</h3><p><b>Cudzysłów „…”</b> służy m.in. do zapisu tytułów oraz do przytaczania czyichś słów.</p><div class="book-example">Czytam „Akademię pana Kleksa”.<br>Mama powiedziała: „Czas na książkę”.</div><p>W tekście pisanym na komputerze tytuł można wyróżnić <b>kursywą</b>, czyli pochyłą czcionką, zamiast cudzysłowu.</p><div class="book-example">Czytam <em>Akademię pana Kleksa</em>.<br>Czytam „Akademię pana Kleksa”.<br><b>Oba zapisy są poprawne.</b></div><p>W tych ćwiczeniach nie łączymy kursywy z cudzysłowem bez potrzeby. Jeżeli polecenie prosi o cudzysłów, użyj go.</p><p>Wpisując odpowiedź, możesz użyć polskich znaków <b>„ ”</b> lub prostych znaków <b>" "</b> — aplikacja uznaje oba warianty.</p><p>Mówimy: <b>w cudzysłowie</b>.</p>`

function showHow(){openModal('Jak grać?',`<div class="rules"><p>Wybierz krainy i tryb. W <b>treningu</b> rozwiązujesz krótką serię, a we <b>wyprawie</b> odwiedzasz wszystkie pięć krain.</p><p><b>Sprawdź</b> oznacza dobre odpowiedzi na zielono, a błędne na czerwono. <b>Popraw</b> otwiera tylko błędne części. <b>Pokaż odpowiedź</b> uzupełnia je na żółto.</p><ul><li><b>2 punkty</b> — poprawnie za pierwszym razem.</li><li><b>1 punkt</b> — po samodzielnym poprawieniu błędu.</li><li><b>0 punktów</b> — po odkryciu odpowiedzi.</li></ul><p>Wskazówka nie odbiera punktów. Każde ukończone zadanie daje też punkty doświadczenia (PD). Nie tracisz zdobytych PD.</p><p><b>Próba klasówki</b> ma 25 zadań z całego zakresu. Rozwiązania i wynik zobaczysz na końcu. Zapisana odpowiedź w próbie nie jest już zmieniana.</p><p><b>Dogrywka</b> zawiera tylko zadania, w których był błąd lub odkryto odpowiedź. Jest nową rundą ćwiczeń.</p><p>Przycisk <b>Zapisz i wróć</b> pozwala przerwać rundę. Po ponownym otwarciu aplikacji wybierz <b>Kontynuuj</b>.</p></div>`);}
function showAbout(){openModal('Zakres i źródła',`<div class="rules"><p><b>Praca Klasowa – Rozdział 2</b> · wersja 1.0.0<br>Język polski, klasa 4 · Strażnicy słów</p><p>Zakres zgodny z przekazaną zapowiedzią sprawdzianu: narrator i podmiot mówiący; rzeczownik — rodzaj, liczba i odmiana przez przypadki; wielka litera w imionach, nazwiskach, przydomkach, pseudonimach i tytułach; cudzysłów i kursywa.</p><p>Podstawa: dostarczone strony 54–102 podręcznika <b>„Słowa na start!”</b>, Nowa Era, rozdział II „Szkolne radości, szkolne smutki”, w szczególności podsumowanie i ćwiczenia na stronach 98–102. Pozostałe tematy rozdziału nie wchodzą do tej próby.</p><p><b>Zadania i krótkie teksty w grze są autorskie.</b> Aplikacja jest materiałem do nauki; nie jest oficjalnym sprawdzianem wydawcy ani zapowiedzią konkretnych pytań nauczyciela.</p><p class="source">Materiały wydawcy (linki wymagają internetu):<br><a href="https://flipbook.nowaera.pl/dokumenty/Flipbook/Jezyk_polski-Slowa_na_start-Zwiastun_podrecznika-Szkola_podstawowa%5Bkl_4%5D%5B2026%5D/files/basic-html/page13.html" target="_blank" rel="noopener noreferrer">Spis treści podręcznika, wydanie 2026</a><br><a href="https://dlanauczyciela.nowaera.pl/zasob/164238,test-podsumowujacy-do-rozdzialu-2-szkolne-radosci-szkolne-smutki-wersja-a.doc" target="_blank" rel="noopener noreferrer">Starszy test wydawcy — 2017, dostęp po zalogowaniu</a></p><p>Aplikacja działa offline. Postęp jest przechowywany wyłącznie w tej przeglądarce. Nie wymaga konta ani klucza AI.</p><div class="reset-area"><button class="text-button" data-action="reset-ask">Wyzeruj postęp tej aplikacji</button></div></div>`);}

function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3500);}
function playTone(kind){if(!state.sound)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const tones=kind==='finish'?[392,523,659,784]:kind==='success'?[523,659,784]:kind==='ok'?[440,587]:[330];tones.forEach((freq,i)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=freq;const now=audioContext.currentTime+i*.1;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.045,now+.02);gain.gain.exponentialRampToValueAtTime(.001,now+.2);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(now);oscillator.stop(now+.22);});}catch{}}
function celebrate(n){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const holder=$('#confetti');for(let i=0;i<n;i++){const el=document.createElement('i');el.className='confetto';el.style.left=(20+Math.random()*60)+'%';el.style.background=['#ffd166','#66bfa1','#6b9dc3','#ef9c7d'][i%4];el.style.setProperty('--drift',(Math.random()*240-120)+'px');el.style.animationDelay=(Math.random()*.3)+'s';holder.appendChild(el);setTimeout(()=>el.remove(),2200);}}
function onInput(e){
 const ctx=current();if(page!=='round'||!ctx)return;const el=e.target;if(el.matches('[data-slot]')){const i=Number(el.dataset.slot);if(locked(ctx.a,i))return;ctx.a.values[i]=el.value;lastFocused=el;delete ctx.a.validation;$('.feedback.validation')?.remove();save();}
 if(el.matches('[data-choice]')){const i=Number(el.dataset.choice),slot=ctx.q.type==='choice'?0:i;if(locked(ctx.a,slot))return;if(ctx.q.type==='choice')ctx.a.values[0]=String(i);else ctx.a.values[i]=el.checked;delete ctx.a.validation;$('.feedback.validation')?.remove();document.querySelectorAll('.choice').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));save();}
}
document.addEventListener('input',onInput);
document.addEventListener('change',e=>{if(e.target.id==='question-count'){count=Number(e.target.value);return;}if(e.target.tagName==='SELECT')onInput(e);});
document.addEventListener('focusin',e=>{if(e.target.matches('input[data-slot],textarea[data-slot]'))lastFocused=e.target;});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();const ctx=current();if(!ctx)return;if(ctx.s.mode==='exam')examNext();else if(ctx.a.done)nextQuestion();else if(ctx.a.phase==='answer')checkAnswer();}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(b.closest('#answer-form'))e.preventDefault();
 if(action==='home'){closeModal();save();showHome();}
 else if(action==='topic'&&mode==='training'){const id=b.dataset.id;selected=selected.includes(id)?selected.filter(v=>v!==id):[...selected,id];renderHome();}
 else if(action==='mode'){mode=b.dataset.mode;renderHome();}
 else if(action==='start')startRequested({mode,topics:selected,count});
 else if(action==='replace-round'){closeModal();if(pendingStart){newSession(pendingStart);pendingStart=null;}}
 else if(action==='resume'){closeModal();if(state.active){page='round';renderRound();window.scrollTo(0,0);}}
 else if(action==='check')checkAnswer();
 else if(action==='correct')correctAnswer();
 else if(action==='reveal')revealAnswer();
 else if(action==='next')nextQuestion();
 else if(action==='exam-next')examNext();
 else if(action==='hint'){const ctx=current();if(ctx&&ctx.s.mode!=='exam'){ctx.a.hintUsed=!ctx.a.hintUsed;save();renderRound();}}
 else if(action==='book')showBook(page==='round'?current()?.q.topic:'voice');
 else if(action==='book-tab')showBook(b.dataset.id);
 else if(action==='close-modal')closeModal();
 else if(action==='how')showHow();
 else if(action==='about')showAbout();
 else if(action==='last-result'){renderResult();window.scrollTo(0,0);}
 else if(action==='retry'&&lastResult){const ids=C.summarize(lastResult.records).retryIds;if(ids.length)startRequested({mode:'retry',ids});}
 else if(action==='export-report')exportReport();
 else if(action==='sound'){state.sound=!state.sound;save();if(state.sound)playTone('success');toast(state.sound?'Dźwięki włączone':'Dźwięki wyłączone');}
 else if(action==='report-answer'){const el=document.getElementById('report-'+b.dataset.id);if(el){el.classList.remove('invisible');b.remove();}}
 else if(action==='reset-ask')openModal('Wyzerować postęp?',`<div class="rules"><p>Usuniesz punkty, opanowane zadania, wyniki i rozpoczętą rundę <b>tej aplikacji</b>.</p><div class="row-buttons"><button class="secondary" data-action="close-modal">Zostaw postęp</button><button class="warn" data-action="reset-confirm">Wyzeruj</button></div></div>`);
 else if(action==='reset-confirm'){state=defaults();lastResult=null;save();closeModal();showHome();toast('Możesz rozpocząć nową przygodę.');}
 else if(action==='insert'){let el=lastFocused;if(!el?.isConnected||el.disabled)el=$('#answer-form input[data-slot]:not(:disabled),#answer-form textarea[data-slot]:not(:disabled)');if(el){const start=el.selectionStart??el.value.length,end=el.selectionEnd??start;el.setRangeText(b.dataset.char,start,end,'end');el.focus({preventScroll:true});el.dispatchEvent(new Event('input',{bubbles:true}));}}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
renderHome();
})();
</script>
</body>
</html>

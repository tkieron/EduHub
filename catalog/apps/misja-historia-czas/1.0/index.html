<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="eduhub:class" content="4"><meta name="eduhub:subject" content="Historia"><meta name="eduhub:name" content="Misja Historia – Czas w historii"><meta name="eduhub:version" content="1.0">
<title>Misja Historia – Czas w historii</title>
<style>
:root{font-family:system-ui,sans-serif;color:#263452;background:#f4f6ff}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(1.6rem,5vw,2.6rem);margin:.4em 0}.sub{color:#536184}.panel{background:white;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 8px 26px #24386614}button,select{font:inherit}button{border:2px solid #dce1f3;border-radius:14px;padding:13px 16px;background:#fff;color:#263452;cursor:pointer;font-weight:650}button:focus-visible{outline:3px solid #8c63ed}button:hover{border-color:#6e5bca}.primary{background:#5849b9;color:white;border-color:#5849b9}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:16px 0}.choices button{min-height:60px}.selected{background:#e4dcff;border-color:#5849b9!important}.correct{background:#d5f8e4!important;border-color:#17894b!important}.wrong{background:#ffe0e0!important;border-color:#c73b46!important}.hidden{display:none!important}.muted{color:#66728d}.progress{height:12px;background:#e4e8f4;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#6c59ce;transition:width .2s}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#e9ecff;padding:8px 12px;border-radius:12px}.timeline{display:flex;gap:7px;align-items:center;overflow:auto;padding:22px 4px}.timeline button{min-width:95px;border-radius:12px;background:#f1efff}.timeline .active{background:#5849b9;color:#fff}.feedback{padding:14px;border-radius:12px;background:#f0f2ff;margin-top:14px;line-height:1.55}.score{font-size:1.4rem;font-weight:800}input[type=number]{font:inherit;width:100%;max-width:300px;padding:13px;border:2px solid #dce1f3;border-radius:12px}label{display:block;margin:10px 0}.footer{font-size:.85rem;color:#66728d}#order button{touch-action:manipulation}#order button small{display:block;color:#66728d;font-weight:400}#order button.selected small{color:#5849b9}@media(max-width:500px){main{padding:12px}.panel{padding:17px}}
</style></head><body><main>
<header><div class="chips"><span class="chip">🏛️ Historia</span><span class="chip">Klasa 4</span><span class="chip">v1.0</span></div><h1>⏳ Misja Historia</h1><div class="sub">Czas w historii • powtórka i kartkówka</div></header>
<section class="panel" id="start"><h2>Wybierz misję</h2><label>Tryb <select id="mode"><option value="learn">Trening — wyjaśnienia po każdym pytaniu</option><option value="test">Kartkówka — wynik na końcu</option></select></label><label>Liczba zadań <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option></select></label><p class="muted">Zadania losowane z siedmiu kategorii. W kartkówce nie pokazujemy odpowiedzi przed końcem.</p><button class="primary" id="begin">Rozpocznij 🚀</button></section>
<section class="panel hidden" id="game"><div class="chips"><span class="chip" id="counter"></span><span class="chip" id="points"></span><span class="chip" id="category"></span></div><p class="progress"><div id="bar" style="width:0"></div></p><h2 id="question"></h2><div id="hint" class="muted"></div><div id="choices" class="choices"></div><div id="order" class="chips"></div><div id="axis" class="timeline"></div><div id="number"></div><div id="feedback" class="feedback hidden"></div><button id="check" class="primary">Sprawdź</button><button id="next" class="primary hidden">Dalej →</button></section>
<section class="panel hidden" id="finish"><h2>🏆 Koniec misji!</h2><div class="score" id="total"></div><div id="breakdown"></div><h3>Powtórz te zagadnienia</h3><div id="mistakes"></div><button class="primary" id="again">Jeszcze raz</button></section><p class="footer">Aplikacja offline • bez AI • odpowiedzi zapisane tylko w trakcie sesji</p>
</main><script>
'use strict';
const $=id=>document.getElementById(id), roman=n=>{let s='';for(const [v,t] of [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']])while(n>=v){s+=t;n-=v}return s};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)],shuffle=a=>[...a].sort(()=>Math.random()-.5);
const fmt=(y,e)=>y+' '+(e==='b'?'p.n.e.':'n.e.'), century=y=>Math.ceil(y/100), yearKey=x=>x.e==='b'?-x.y:x.y;
const epochs=[
['Prehistoria','od pojawienia się pierwszych ludzi do wynalezienia pisma'],
['Starożytność','od wynalezienia pisma do 476 roku n.e.'],
['Średniowiecze','od 476 do 1492 roku'],
['Nowożytność','od 1492 do 1918 roku'],
['Współczesność','od 1918 roku do dziś']];
const concepts=[['Chronologia','porządkowanie wydarzeń według czasu ich występowania'],['Era','okres liczony od ważnego wydarzenia'],['Wiek','100 lat'],['Tysiąclecie','1000 lat'],['Półwiecze','50 lat'],['Doba','24 godziny'],['Kalendarz','narzędzie do liczenia dni, miesięcy i lat']];
let questions=[],index=0,score=0,answers=[],selected=null,sequence=[],current=null,mode='learn',locked=false;
function choice(q,opts,answer,explain,cat){return {type:'choice',q,opts:shuffle([...new Set(opts)]),answer,explain,cat}}
function makeCentury(){
 const y=pick([1,100,101,476,753,776,966,1000,1001,1025,1492,1600,1601,1791,1800,1801,1900,1901,1918,1939,2000,2001,2025,2026,rnd(201,2099)]),e=Math.random()<.2?'b':'n',c=century(y);
 const vals=[c,c-1,c+1,c+2].filter(x=>x>0&&x<40);
 return choice('Który to wiek? '+fmt(y,e),vals.map(roman),roman(c),'Wiek '+roman(c)+' obejmuje lata '+fmt((c-1)*100+1,e)+'–'+fmt(c*100,e)+'. Rok kończący się na 00 należy do kończącego się wieku.', 'Obliczanie wieku');
}
function makeHalf(){const c=rnd(5,21),first=Math.random()<.5,y=(c-1)*100+(first?rnd(1,50):rnd(51,100));return choice('Która połowa wieku? '+y+' r. n.e.', ['I połowa','II połowa'],(first?'I':'II')+' połowa','I połowa: lata '+((c-1)*100+1)+'–'+((c-1)*100+50)+', II połowa: '+((c-1)*100+51)+'–'+(c*100)+'.','Połowy wieków')}
function makeEpoch(){const i=rnd(0,4),p=epochs[i];return choice('Która epoka pasuje do opisu: „'+p[1]+'”?',epochs.map(x=>x[0]),p[0],'Epoki w kolejności: '+epochs.map(x=>x[0]).join(' → ')+'.','Epoki historyczne')}
function makeConcept(){const p=pick(concepts);return choice('Co oznacza: '+p[0]+'?',concepts.map(x=>x[1]),p[1],p[0]+' — '+p[1]+'.','Pojęcia i pomiar czasu')}
function makeTime(){const p=pick([['zegar słoneczny','cień wskazówki na tarczy'],['klepsydra','przesypujący się piasek'],['zegar wodny','przepływ wody'],['kalendarz','następowanie dni, miesięcy i lat']]);return choice('Jak działa '+p[0]+'?', ['cień wskazówki na tarczy','przesypujący się piasek','przepływ wody','następowanie dni, miesięcy i lat'],p[1],p[0]+': '+p[1]+'.','Mierzenie czasu')}
function makeElapsed(){const b=Math.random()<.3;if(b){const y1=rnd(200,900),y2=rnd(500,2000);return {type:'number',q:'Ile lat upłynęło między '+fmt(y1,'b')+' a '+fmt(y2,'n')+'?',answer:y1+y2-1,explain:y1+' + '+y2+' − 1 = '+(y1+y2-1)+'. Nie ma roku zerowego.',cat:'Upływ czasu'}}const a=rnd(500,1800),b2=a+rnd(40,220);return {type:'number',q:'Ile lat upłynęło od '+a+' r. do '+b2+' r. n.e.?',answer:b2-a,explain:b2+' − '+a+' = '+(b2-a)+' lat.',cat:'Upływ czasu'}}
function makeOrder(){const pool=[{y:776,e:'b'},{y:44,e:'b'},{y:476,e:'n'},{y:966,e:'n'},{y:1025,e:'n'},{y:1492,e:'n'},{y:1569,e:'n'},{y:1655,e:'n'},{y:1791,e:'n'},{y:1918,e:'n'},{y:1939,e:'n'},{y:2025,e:'n'}];const items=shuffle(pool).slice(0,4);return {type:'order',q:'Ułóż daty od najstarszej do najmłodszej. Klikaj kolejno.',items,answer:[...items].sort((a,b)=>yearKey(a)-yearKey(b)).map(x=>fmt(x.y,x.e)),explain:'Przed naszą erą większa liczba oznacza wcześniejszą datę. Po naszej erze — odwrotnie.',cat:'Chronologia i oś czasu'}}
function makeAxis(){const a=pick([{y:776,e:'b'},{y:966,e:'n'},{y:1492,e:'n'},{y:1791,e:'n'},{y:1900,e:'n'},{y:1901,e:'n'},{y:2001,e:'n'}]);const items=shuffle([a,...shuffle([{y:476,e:'n'},{y:1025,e:'n'},{y:1918,e:'n'},{y:2025,e:'n'},{y:44,e:'b'},{y:753,e:'b'}].filter(x=>fmt(x.y,x.e)!==fmt(a.y,a.e))).slice(0,3)]);return {type:'axis',q:'Wskaż na osi czasu datę: '+fmt(a.y,a.e),items,answer:fmt(a.y,a.e),explain:'Na osi czasu daty rosną od lewej do prawej; p.n.e. znajduje się przed n.e.',cat:'Chronologia i oś czasu'}}
const generators=[makeCentury,makeHalf,makeEpoch,makeConcept,makeTime,makeElapsed,makeOrder,makeAxis];
function start(){mode=$('mode').value;const n=Number($('count').value);questions=Array.from({length:n},(_,i)=>generators[i%generators.length]());questions=shuffle(questions);index=score=0;answers=[];$('start').classList.add('hidden');$('finish').classList.add('hidden');$('game').classList.remove('hidden');show()}
function show(){current=questions[index];selected=null;sequence=[];locked=false;$('counter').textContent='Zadanie '+(index+1)+'/'+questions.length;$('points').textContent='Punkty: '+score;$('category').textContent=current.cat;$('bar').style.width=(index/questions.length*100)+'%';$('question').textContent=current.q;$('hint').textContent=current.type==='order'?'Dotknij dat w odpowiedniej kolejności. Dotknij ponownie zaznaczoną datę, aby cofnąć ostatni wybór.':current.type==='axis'?'Daty na osi są ustawione chronologicznie.':'';['choices','order','axis','number'].forEach(id=>{$(id).innerHTML='';$(id).classList.add('hidden')});$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('next').classList.add('hidden');
 if(current.type==='choice'){const area=$('choices');area.classList.remove('hidden');current.opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(locked)return;selected=o;area.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))};area.append(b)})}
 if(current.type==='number'){$('number').classList.remove('hidden');$('number').innerHTML='<input id="numeric" type="number" inputmode="numeric" placeholder="Wpisz liczbę lat" aria-label="Liczba lat">'}
 if(current.type==='order'){const area=$('order');area.classList.remove('hidden');current.items.forEach(x=>{const b=document.createElement('button');b.textContent=fmt(x.y,x.e);b.onclick=()=>{if(locked)return;const v=b.textContent;if(sequence.includes(v)){if(sequence.at(-1)===v){sequence.pop();b.classList.remove('selected');b.querySelector('small')?.remove()}return}sequence.push(v);b.classList.add('selected');const s=document.createElement('small');s.textContent='Pozycja '+sequence.length;b.append(s)};area.append(b)})}
 if(current.type==='axis'){const area=$('axis');area.classList.remove('hidden');[...current.items].sort((a,b)=>yearKey(a)-yearKey(b)).forEach(x=>{const b=document.createElement('button');b.textContent=fmt(x.y,x.e);b.onclick=()=>{if(locked)return;selected=b.textContent;area.querySelectorAll('button').forEach(z=>z.classList.toggle('active',z===b))};area.append(b)})}
}
function check(){if(locked)return;const q=current;let given=q.type==='number'?Number($('numeric')?.value):q.type==='order'?sequence: selected;if(q.type==='number'&&!$('numeric').value.trim())return;if(q.type==='order'&&sequence.length!==q.items.length)return;if((q.type==='choice'||q.type==='axis')&&!given)return;const ok=q.type==='order'?JSON.stringify(given)===JSON.stringify(q.answer):given===q.answer;locked=true;if(ok)score++;answers.push({cat:q.cat,ok,q:q.q,correct:Array.isArray(q.answer)?q.answer.join(' → '):q.answer,given:Array.isArray(given)?given.join(' → '):given,explain:q.explain});$('points').textContent='Punkty: '+score;$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===questions.length-1?'Zobacz wynik':'Dalej →';if(mode==='learn'){const f=$('feedback');f.classList.remove('hidden');f.innerHTML='<strong>'+(ok?'✅ Dobrze!':'❌ Spróbuj zapamiętać:')+'</strong><div></div><p></p>';f.querySelector('div').textContent='Poprawna odpowiedź: '+(Array.isArray(q.answer)?q.answer.join(' → '):q.answer);f.querySelector('p').textContent=q.explain}}
function finish(){ $('game').classList.add('hidden');$('finish').classList.remove('hidden');$('total').textContent=score+' / '+questions.length+' punktów ('+Math.round(score/questions.length*100)+'%)';const cats={};answers.forEach(a=>{cats[a.cat]??={ok:0,all:0};cats[a.cat].all++;if(a.ok)cats[a.cat].ok++});$('breakdown').innerHTML='';Object.entries(cats).forEach(([k,v])=>{const p=document.createElement('p');p.textContent=k+': '+v.ok+'/'+v.all;$('breakdown').append(p)});$('mistakes').innerHTML='';const bad=answers.filter(a=>!a.ok);if(!bad.length)$('mistakes').textContent='Brawo! Wszystkie odpowiedzi poprawne 🎉';bad.forEach(a=>{const p=document.createElement('div');p.className='feedback';const strong=document.createElement('strong');strong.textContent=a.q;const d=document.createElement('div');d.textContent='Twoja odpowiedź: '+a.given+' | Poprawna: '+a.correct;const e=document.createElement('div');e.textContent=a.explain;p.append(strong,d,e);$('mistakes').append(p)})}
$('begin').onclick=start;$('check').onclick=check;$('next').onclick=()=>{index++;if(index===questions.length)finish();else show()};$('again').onclick=()=>{$('finish').classList.add('hidden');$('start').classList.remove('hidden')};
</script></body></html>

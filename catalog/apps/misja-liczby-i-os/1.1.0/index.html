// Liczby zapisane polskimi słowami -> rzeczywista wartość, niezależnie od liczby w zadaniu.
// Obsługa rozpoznawania mowy: „sto ...”, „124 tysiące 895” lub „124 895”.
const SPEECH_CHUNKS=Object.freeze({
 zero:0,jeden:1,jedna:1,jedno:1,dwa:2,dwie:2,trzy:3,cztery:4,piec:5,szesc:6,siedem:7,osiem:8,dziewiec:9,

 dwadziescia:20,trzydziesci:30,czterdziesci:40,piecdziesiat:50,szescdziesiat:60,siedemdziesiat:70,osiemdziesiat:80,dziewiecdziesiat:90,
 sto:100,dwiescie:200,trzysta:300,czterysta:400,piecset:500,szescset:600,siedemset:700,osiemset:800,dziewiecset:900
});
const SPEECH_SCALES=Object.freeze({tysiac:1000,tysiace:1000,tysiecy:1000,tysiaca:1000,milion:1000000,miliony:1000000,milionow:1000000,miliard:1000000000,miliardy:1000000000,miliardow:1000000000});

function parseSpeechChunk(tokens){
 if(!tokens.length)return null;
 if(tokens.length===1&&/^\d{1,3}$/.test(tokens[0]))return Number(tokens[0]);

function spokenToNumber(utterance){

 // Rozpoznawanie mowy często samo zamienia słowa na zapis liczbowy.
 if(/^[\d\s\u00a0\u202f.,]+$/.test(raw)){

 }
 let tokens=speechTokenize(raw);
 // Dopuszczamy krótkie wstępy, które system mowy czasem dodaje.
 while(tokens.length&&['to','jest','liczba','wynik','powiedzialem','powiedzialam'].includes(tokens[0]))tokens.shift();
 if(!tokens.length)return null;
 let total=0,chunk=[],previousScale=Infinity,scaleUsed=false;
 for(const token of tokens){
  const scale=SPEECH_SCALES[token];
  if(scale){
   if(scale>=previousScale)return null; // kolejność: miliardy → miliony → tysiące
   const n=chunk.length?parseSpeechChunk(chunk):1;
   if(n===null||n===0)return null;
   total+=n*scale;previousScale=scale;chunk=[];scaleUsed=true;
  }else chunk.push(token);
 }

 if(tail===null){
  // ASR może powiedzieć „124 tysiące 895” — cyfry mieszane ze słowami są akceptowane.
  return null;
 }
 if(!scaleUsed&&!chunk.length)return null;

}

}

function startSpeechRecognition(){
 const q=state.screen==='play'?current():null;
 if(!q||q.type!=='words'||state.solved)return;
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){state.voice={status:'error',transcript:'',value:null,reason:'Ta przeglądarka nie obsługuje dyktowania. Spróbuj w aktualnym Chrome lub wpisz odpowiedź.'};render();return}

  if(activeSpeechRecognizer!==r||state.screen!=='play'||state.index!==index||state.solved)return;

}

function persisted(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(prefs))}catch(e){}}
function beep(ok=true){if(!prefs.sound)return;try{let AC=window.AudioContext||window.webkitAudioContext;let ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=ok?'sine':'triangle';osc.frequency.setValueAtTime(ok?530:260,ctx.currentTime);if(ok)osc.frequency.exponentialRampToValueAtTime(820,ctx.currentTime+.11);else osc.frequency.exponentialRampToValueAtTime(185,ctx.currentTime+.17);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.075,ctx.currentTime+.014);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.20);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.22);osc.onended=()=>ctx.close()}catch(e){}}
function numberQuestion(){let digits=pick([4,4,5,5,6,6,7,7,8,8,9,9,10,11]);let base=10**(digits-1);let n=rnd(base,Math.min(base*10-1,999999999999));const pattern=rnd(0,6);if(pattern===0)n=Math.floor(n/1000)*1000;if(pattern===1)n=Math.floor(n/100)*100;if(pattern===2)n=Math.floor(n/1000000)*1000000||1000000;if(pattern===3)n=Math.floor(n/1000)*1000+rnd(1,9);if(pattern===4)n=Math.floor(n/10)*10;if(pattern===5)n=Math.floor(n/100000)*100000+rnd(1,99);n=Math.max(1000,n);return n}
function axisQuestion(type){const [start,step]=pick(AXES);return {type,topic:type==='draw'?'draw':'axis',start,step,targetIndex:pick([1,2,4,5,6]),letter:pick(['A','B','C','D']),count:axisN}}

function generateQuestions(){const types=state.topic==='numbers'?['words','digits']:state.topic==='axis'?['read','mark']:state.topic==='draw'?['draw']:['words','digits','read','mark','draw'];let result=[];for(let i=0;i<state.count;i++)result.push(makeQuestion(types[i%types.length]));return shuffle(result)}
function current(){return state.questions[state.index]}
function questionText(q){if(q.type==='words')return fmt(q.n)+' → zapis słowny';if(q.type==='digits')return numberToWords(q.n)+' → cyfry';if(q.type==='read')return `Punkt ${q.letter} na osi (skok ${q.step})`;if(q.type==='mark')return `${q.letter} = ${q.start+q.step*q.targetIndex} na osi`;return `Oś od ${q.start} co ${q.step}; ${q.letter} = ${q.start+q.step*q.targetIndex}`}
function correctText(q){return(q.type==='words'||q.type==='digits')?`${fmt(q.n)} — ${numberToWords(q.n)}`:`${q.letter} = ${q.start+q.step*q.targetIndex} (krok ${q.step})`}
function startSession(reuse){state.questions=reuse?reuse.map(q=>({...q})):generateQuestions();state.index=0;state.results=[];state.screen='play';resetQuestion();render()}

function numberHints(q){if(q.type==='words'||q.type==='digits')return 'Czytaj liczbę w grupach po trzy cyfry od prawej: jedności, tysiące, miliony, miliardy. Zera w środku grup nie czytamy jako oddzielnych słów.';if(q.type==='read'||q.type==='mark')return `Jedna kreska to ${q.step}. Pierwsza zaznaczona liczba to ${q.start}. Kolejne punkty: ${q.start}, ${q.start+q.step}, ${q.start+2*q.step}…`;return `Między krańcami osi narysuj ${axisN} jednakowych odcinków. Jednostka liczbowa wynosi ${q.step}, więc trzy kroki to ${3*q.step}.`}

function axisSvg(q,mode='read'){const g=axisGeometry();const showPoint=mode==='read',mark=mode==='mark',sel=state.selectedTick;let parts=[];parts.push(`<svg class="axis-board" viewBox="0 0 ${g.width} 230" role="img" aria-label="Oś liczbowa; jednostka ${q.step}, punkt ${q.letter}">`);parts.push(`<defs><marker id="arrow-${mode}" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536d9f"/></marker></defs>`);parts.push(`<line x1="${g.x0-(g.small?17:34)}" y1="128" x2="${g.x1+(g.small?18:46)}" y2="128" stroke="#536d9f" stroke-width="${g.small?3:4}" marker-end="url(#arrow-${mode})" stroke-linecap="round"/>`);for(let i=0;i<=axisN;i++){let x=g.x0+i*g.dx;parts.push(`<line x1="${x}" y1="113" x2="${x}" y2="143" stroke="#657a9f" stroke-width="${g.small?2.7:3}"/>`);if([0,3,7].includes(i)&&(!showPoint||i!==q.targetIndex))parts.push(`<text x="${x}" y="174" text-anchor="middle" fill="#3d4f78" font-size="${g.small?20:25}" font-weight="800">${fmt(q.start+i*q.step)}</text>`)}if(showPoint){let x=g.x0+q.targetIndex*g.dx;parts.push(`<line x1="${x}" y1="120" x2="${x}" y2="79" stroke="#7552e9" stroke-width="3" stroke-dasharray="5 6"/><circle cx="${x}" cy="128" r="${g.small?9:11}" fill="#7251e6" stroke="white" stroke-width="3"/><text x="${x}" y="61" text-anchor="middle" font-size="${g.small?30:35}" font-weight="900" fill="#7152dd">${q.letter}</text>`)}if(mark&&sel!==null){const x=g.x0+sel*g.dx;parts.push(`<circle cx="${x}" cy="128" r="${g.small?10:12}" fill="#7056e9" stroke="white" stroke-width="3"/><text x="${x}" y="70" text-anchor="middle" font-weight="900" font-size="${g.small?28:34}" fill="#7152dd">${q.letter}</text>`)}if(mark&&!state.solved)for(let i=0;i<=axisN;i++)parts.push(`<rect x="${g.x0+i*g.dx-g.dx/2}" y="88" width="${g.dx}" height="90" fill="transparent" data-tick="${i}" role="button" tabindex="0" aria-label="Kreska ${i+1}"/>`);parts.push(`</svg>`);return parts.join('')}
function axisQuestionUi(q){if(q.type==='read')return `<div class="axis-shell">${axisSvg(q,'read')}</div><p class="tap-help">Uważnie policz kreski. Jednostka nie zawsze wynosi 1!</p><div style="margin-top:24px">${inputArea(q)}</div>`;const selected=state.selectedTick;return `<div class="coordinate-challenge"><span class="eyebrow">Zaznacz punkt</span><strong>${q.letter} = ${fmt(q.start+q.step*q.targetIndex)}</strong></div><div class="axis-shell">${axisSvg(q,'mark')}<div class="legend">Dotknij jednej z kresek, aby ustawić <strong>${q.letter}</strong></div></div><div class="axis-controls"><button type="button" class="small-control" data-action="tick-minus" aria-label="Przesuń w lewo">−</button><span class="axis-selection">${selected===null?'Nie wybrano punktu':`Wybrano kreskę <strong>${selected+1}</strong>`}</span><button type="button" class="small-control" data-action="tick-plus" aria-label="Przesuń w prawo">+</button></div><div class="response-row">${actionButtons().replace('type="submit"','type="button" data-action="check"')}</div>`}
function buildSvg(q){const g=axisGeometry();let stage=state.stage,parts=[];parts.push(`<svg id="builderSvg" class="build-board" viewBox="0 0 ${g.width} 245" tabindex="0" aria-label="Plansza rysowania osi liczbowej">`);parts.push(`<defs><pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#d8e1f1" /></pattern><marker id="buildArrow" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6650ce" stroke-width="2.5"/></marker></defs><rect x="0" y="0" width="${g.width}" height="245" rx="12" fill="url(#dotgrid)"/>`);if(stage===0){parts.push(`<circle cx="${g.x0}" cy="128" r="14" fill="#16a79d" stroke="#c8fff1" stroke-width="6"/><circle cx="${g.x1}" cy="128" r="14" fill="#755be6" stroke="#e5deff" stroke-width="6"/><text x="${g.x0}" y="185" text-anchor="middle" fill="#41837d" font-weight="900" font-size="${g.small?16:18}">START</text><text x="${g.x1}" y="185" text-anchor="middle" fill="#735ec4" font-weight="900" font-size="${g.small?16:18}">META</text><line id="dragPreview" x1="${g.x0}" x2="${g.x0}" y1="128" y2="128" stroke="#7860d5" stroke-width="5" stroke-linecap="round" opacity="0"/>`)}else{parts.push(`<line x1="${g.x0-(g.small?17:27)}" y1="128" x2="${g.x1+(g.small?17:33)}" y2="128" stroke="#6d57d1" stroke-width="4" marker-end="url(#buildArrow)"/>`);if(stage===1){parts.push(`<line x1="${g.x0}" y1="111" x2="${g.x0}" y2="145" stroke="#243c71" stroke-width="3"/><line x1="${g.x1}" y1="111" x2="${g.x1}" y2="145" stroke="#243c71" stroke-width="3"/><text x="${g.x0}" y="174" text-anchor="middle" font-size="20" fill="#273b6c" font-weight="800">${q.start}</text><text x="${g.width/2}" y="43" text-anchor="middle" font-size="18" fill="#877fa2">7 równych odcinków</text>`)}else{for(let i=0;i<=axisN;i++){const x=g.x0+i*g.dx;parts.push(`<line x1="${x}" y1="110" x2="${x}" y2="146" stroke="#2f4377" stroke-width="3"/>`);if(i===0||i===3){let label=stage>=3?fmt(q.start+i*q.step):'?';parts.push(`<text x="${x}" y="180" text-anchor="middle" font-size="${g.small?23:25}" font-weight="900" fill="${stage>=3?'#4d3ec0':'#cf9640'}">${label}</text>`)}}if(state.selectedTick!==null&&stage>=3){let x=g.x0+g.dx*state.selectedTick;parts.push(`<circle cx="${x}" cy="128" r="12" fill="#03a99e" stroke="#fff" stroke-width="4"/><text x="${x}" y="87" text-anchor="middle" font-size="32" fill="#008f87" font-weight="900">${q.letter}</text>`)}}}parts.push(`</svg>`);return parts.join('')}
function builderUi(q){const step=state.stage;const stepTexts=[`Przeciągnij palcem lub myszką od START do META. Oś ma zwrot w prawo.`,`Podziel narysowaną oś na 7 równych odcinków. Dotknij miejsca <strong>drugiej kreski</strong> (pierwsza jest przy ${q.start}).`,`Podpisz <strong>pierwszą</strong> i <strong>czwartą</strong> kreskę. Wartość pierwszej to ${q.start}, a jednostka to ${q.step}.`,`Zaznacz punkt <strong>${q.letter} = ${fmt(q.start+q.step*q.targetIndex)}</strong>. Dotknij odpowiedniej kreski.`];return `<div class="builder-step"><span class="step-dot">${step+1}</span><div>${stepTexts[step]}</div></div><div class="axis-shell">${buildSvg(q)}</div><div class="draw-review">${['Narysuj linię','Wyznacz jednostkę','Podpisz liczby','Zaznacz punkt'].map((x,i)=>`<span class="mini-step ${i<step?'done':i===step?'on':''}">${i<step?'✓ ':''}${x}</span>`).join('')}</div>${step===0?`<p class="tap-help">Wskazówka: rysuj od zielonego kółka do fioletowego.</p>`:step===1?`<p class="tap-help">7 odcinków = 8 kresek. Rozmieść je równo na całej długości.</p>`:step===2?`<div class="builder-form"><div><label for="drawStart">Wartość 1. kreski</label><input class="answer-input" type="text" inputmode="numeric" id="drawStart" value="${escapeHtml(state.drawFields.start)}" placeholder="Pierwsza liczba" /></div><div><label for="drawMiddle">Wartość 4. kreski</label><input class="answer-input" type="text" inputmode="numeric" id="drawMiddle" value="${escapeHtml(state.drawFields.middle)}" placeholder="Czwarta liczba" /></div></div>`:`<div class="axis-controls"><button class="small-control" data-action="tick-minus" aria-label="Punkt w lewo">−</button><span class="axis-selection">${state.selectedTick===null?'Wybierz kreskę':`Wybrano kreskę <strong>${state.selectedTick+1}</strong>`}</span><button class="small-control" data-action="tick-plus" aria-label="Punkt w prawo">+</button></div>`}<div class="response-row">${state.solved?actionButtons():`<span>${state.mode==='train'?'<button class="hint-btn" data-action="hint">💡 Podpowiedź</button>':'<span class="tiny">Rysunek powstaje krok po kroku</span>'}</span>${step>=2?'<button class="primary" type="button" data-action="check">Sprawdź ✓</button>':'<span class="tiny">Rysuj bezpośrednio na planszy ✨</span>'}`}</div>`}
function explanation(q){let text='';if(q.type==='words'||q.type==='digits'){text='Grupujemy cyfry po trzy, od prawej. Każda grupa ma własną nazwę.'}else{text=`Pierwsza współrzędna to ${fmt(q.start)}. Jeden odcinek ma wartość ${fmt(q.step)}. Punkt ${q.letter} leży ${q.targetIndex} odcinków dalej, czyli ${fmt(q.start)} + ${q.targetIndex} × ${fmt(q.step)} = ${fmt(q.start+q.targetIndex*q.step)}.`}return `<div class="explanation"><strong>✅ Rozwiązanie: ${escapeHtml(correctText(q))}</strong><p>${escapeHtml(text)}</p>${(q.type==='words'||q.type==='digits')?numberGroupUi(q.n):''}</div>`}
function numberGroupUi(n){let parts=[];let labels=['jedności','tysiące','miliony','miliardy'];let i=0;do{parts.unshift({v:i===0?String(n%1000):String(n%1000).padStart(3,'0'),name:labels[i]});n=Math.floor(n/1000);i++}while(n>0);return `<div class="digit-groups">${parts.map(p=>`<div class="digit-group"><strong>${p.v}</strong><span>${p.name}</span></div>`).join('')}</div>`}
function statusUi(){let s=state.message;return `${s?`<div role="status" class="status ${s.kind}"><span class="symbol">${s.kind==='good'?'🌟':s.kind==='bad'?'🔄':'💡'}</span><span>${escapeHtml(s.text)}</span></div>`:''}${state.showHint&&!state.solved?`<div class="hint-box">💡 ${escapeHtml(numberHints(current()))}</div>`:''}${state.solved?explanation(current()):''}`}
function renderPlay(){const q=current();let cat=q.topic;let points=state.results.reduce((sum,r)=>sum+r.earned,0);const percent=Math.round(state.index/state.questions.length*100);let prompt=q.type==='words'?'Zapisz lub powiedz tę liczbę słownie':q.type==='digits'?'Zapisz tę liczbę cyframi':q.type==='read'?`Ile wynosi współrzędna punktu ${q.letter}?`:q.type==='mark'?`Znajdź właściwe miejsce dla punktu ${q.letter}`:'Samodzielnie skonstruuj oś liczbową';return `<div class="score-strip"><span class="badge">${topicDefs[cat].icon} ${topicDefs[cat].title} · ${state.index+1}/${state.questions.length}</span><div class="score-items"><span class="score-metric">🔄 ${state.errors} ${state.errors===1?'błąd':'błędów'}</span><span class="score-metric">⭐ ${points}</span></div></div><div class="progress-track" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100" aria-label="Postęp misji"><div class="progress-fill" style="width:${percent}%"></div></div><div class="question-head"><div class="question-emoji">${icons[q.type]}</div><div class="question-info"><div class="question-label">Zadanie ${state.index+1} · ${names[q.type]}</div><h2 class="question-title">${prompt}</h2></div></div>${q.type==='words'?`<div class="challenge"><div class="challenge-number">${fmt(q.n)}</div><div class="challenge-caption">Każdą grupę trzech cyfr czytamy osobno.</div></div>${inputArea(q)}`:q.type==='digits'?`<div class="challenge"><div class="challenge-words">${numberToWords(q.n)}</div><div class="challenge-caption">Zapisz same cyfry. Spacje są dozwolone.</div></div>${inputArea(q)}`:q.type==='read'||q.type==='mark'?axisQuestionUi(q):builderUi(q)}${statusUi()}${!state.solved?`<div style="text-align:right;margin-top:18px"><button class="hint-btn" data-action="skip" style="color:#8491a9">Pomiń to zadanie →</button></div>`:''}`}
function renderHome(){return `<span class="eyebrow">🎯 Przygotowanie do kartkówki</span><div class="hero"><div><h1>Misja <span>Liczby i Oś</span></h1><p>Wielkie liczby, tajemnicze współrzędne i oś, którą narysujesz samodzielnie. Rozwiąż misję i zbierz gwiazdki!</p></div><div class="hero-art" aria-hidden="true"><span class="sparkle one">✨</span><span class="space-emoji">🚀</span><span class="sparkle two">⭐</span><span class="sparkle three">🪐</span></div></div><div class="section-label">1. Wybierz misję</div><div class="mission-grid"><button class="mission-option ${state.topic==='mixed'?'selected':''}" data-topic="mixed" aria-pressed="${state.topic==='mixed'}"><span class="option-icon">🌎</span><span class="option-title">Cała kartkówka</span><span class="option-desc">Wszystkie 3 tematy razem</span></button>${Object.entries(topicDefs).map(([key,t])=>`<button class="mission-option ${state.topic===key?'selected':''}" data-topic="${key}" aria-pressed="${state.topic===key}"><span class="option-icon">${t.icon}</span><span class="option-title">${t.title}</span><span class="option-desc">${t.desc}</span></button>`).join('')}</div><div class="configuration"><section><div class="section-label">2. Ile zadań?</div><div class="pill-row">${[5,10,15,20,25].map(n=>`<button class="choice ${state.count===n?'selected':''}" data-count="${n}" aria-pressed="${state.count===n}">${n}</button>`).join('')}</div></section><section><div class="section-label">3. Jaki tryb?</div><div class="pill-row"><button class="choice mode-option ${state.mode==='quiz'?'selected':''}" data-mode="quiz" aria-pressed="${state.mode==='quiz'}">🧠 Kartkówka</button><button class="choice mode-option ${state.mode==='train'?'selected':''}" data-mode="train" aria-pressed="${state.mode==='train'}">💡 Trening</button></div><p class="tiny">${state.mode==='quiz'?'Bez podpowiedzi, z oceną i poprawkami.':'Z podpowiedziami i bez presji czasu.'}</p></section></div><div class="start-row"><div class="microcopy">📖 Zgodnie z zakresem podręcznika, str. 56–63.<br>🔒 Zadania działają offline. Mikrofon korzysta z usługi rozpoznawania mowy przeglądarki i może wymagać Internetu.</div><button class="primary" data-action="start">Rozpocznij misję 🚀</button></div>`}
function renderEnd(){const r=state.results;const max=r.length*2;const points=r.reduce((a,x)=>a+x.earned,0);const percent=max?Math.round(points/max*100):0;const perfect=r.filter(x=>x.earned===2).length;const mistake=r.filter(x=>x.errors>0||x.skipped);const buckets=['numbers','axis','draw'].map(k=>{const arr=r.filter(x=>x.q.topic===k);const p=arr.reduce((a,x)=>a+x.earned,0);return{k,title:topicDefs[k].title,count:arr.length,p,max:arr.length*2}}).filter(x=>x.count);const headline=percent>=90?'Mistrzowska misja!':percent>=65?'Świetna robota!':percent>=40?'Idziesz w dobrą stronę!':'Trening czyni mistrza!';const rec=buckets.slice().sort((a,b)=>a.p/a.max-b.p/b.max)[0];return `<div class="end-head"><div class="medal">${percent>=85?'🏆':percent>=55?'🥇':'🌟'}</div><span class="eyebrow">Misja zakończona</span><h1>${headline}</h1><p>${percent>=65?'Liczby nie mają przed Tobą tajemnic.': 'Każda próba to nauka. Sprawdź zadania, które warto powtórzyć.'}</p></div><div class="summary-grid"><div class="summary-tile"><span class="big">${percent}%</span><small>Wynik kartkówki</small></div><div class="summary-tile"><span class="big">${points}/${max}</span><small>Gwiazdki</small></div><div class="summary-tile"><span class="big">${perfect}</span><small>Bez pomyłki</small></div></div><div class="topic-report"><h3>📊 ${buckets.length===3?'Raport z trzech obszarów':'Raport wyników'}</h3>${buckets.map(b=>`<div class="topic-row"><span>${escapeHtml(b.title)}</span><div class="bar"><div class="bar-fill" style="width:${Math.round(b.p/b.max*100)}%"></div></div><span>${Math.round(b.p/b.max*100)}%</span></div>`).join('')}${rec&&rec.p<rec.max?`<div class="hint-box">🎯 Najwięcej zyskasz, ćwicząc teraz: <strong>${rec.title}</strong>.</div>`:''}</div>${mistake.length?`<div class="topic-report"><h3>🔍 Do powtórzenia (${mistake.length})</h3>${mistake.slice(0,8).map(x=>`<div class="wrong-card"><strong>${names[x.q.type]}:</strong> ${escapeHtml(questionText(x.q))}<div>✅ ${escapeHtml(correctText(x.q))} · ${x.skipped?'pominięte':x.errors+' błędów'}</div></div>`).join('')}${mistake.length>8?`<p class="tiny">I jeszcze ${mistake.length-8} zadań do powtórki.</p>`:''}</div>`:`<div class="status good">🌟 Fantastycznie — wszystkie zadania rozwiązane bez pominięć i pomyłek!</div>`}<div class="end-actions">${mistake.length?`<button class="primary" data-action="repeat">🔄 Powtórz trudne (${mistake.length})</button>`:''}<button class="secondary" data-action="restart">Nowa misja</button><button class="secondary" data-action="home">Wybór tematów</button></div>`}
function updateHeader(){document.getElementById('lifetimeStat').textContent='⭐ '+prefs.stars;document.getElementById('soundBtn').textContent=prefs.sound?'🔊':'🔇';document.getElementById('soundBtn').title=prefs.sound?'Wyłącz dźwięki':'Włącz dźwięki'}
function render(){root.innerHTML=state.screen==='home'?renderHome():state.screen==='play'?renderPlay():renderEnd();updateHeader();bindBoard()}
function setSelectionTick(tick){if(state.solved)return;if(state.selectedTick===tick)return;state.selectedTick=Math.max(0,Math.min(axisN,tick));state.message=null;render()}
function coordinates(evt,el){const p=el.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;const m=el.getScreenCTM();if(!m)return{x:0,y:0};const loc=p.matrixTransform(m.inverse());return{x:loc.x,y:loc.y}}
function builderWrong(msg){failure(msg)}
function bindBoard(){const q=state.screen==='play'?current():null;if(!q||state.solved)return;
if(q.type==='mark'){const g=axisGeometry();const svg=root.querySelector('.axis-board');if(!svg)return;svg.addEventListener('click',event=>{const xy=coordinates(event,svg),idx=Math.max(0,Math.min(axisN,Math.round((xy.x-g.x0)/g.dx)));if(xy.y>=73&&xy.y<=194&&xy.x>=g.x0-g.dx/2&&xy.x<=g.x1+g.dx/2)setSelectionTick(idx)});svg.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.hasAttribute('data-tick')){event.preventDefault();setSelectionTick(Number(event.target.getAttribute('data-tick')))}})}
if(q.type!=='draw')return;const g=axisGeometry();const svg=root.querySelector('#builderSvg');if(!svg)return;
if(state.stage===0){let gesture=null;svg.addEventListener('pointerdown',event=>{const p=coordinates(event,svg);if(Math.hypot(p.x-g.x0,p.y-axisY)>(g.small?48:65)){state.message={kind:'info',text:'Zacznij na zielonym kółku START.'};render();return}gesture={id:event.pointerId,start:p};svg.setPointerCapture(event.pointerId);event.preventDefault()});svg.addEventListener('pointermove',event=>{if(!gesture||gesture.id!==event.pointerId)return;const p=coordinates(event,svg),line=svg.querySelector('#dragPreview');if(line){line.setAttribute('x2',String(Math.min(g.width-20,Math.max(20,p.x))));line.setAttribute('y2',String(Math.min(208,Math.max(49,p.y))));line.setAttribute('opacity','1')}});svg.addEventListener('pointerup',event=>{if(!gesture||gesture.id!==event.pointerId)return;const p=coordinates(event,svg);gesture=null;const good=Math.hypot(p.x-g.x1,p.y-128)<(g.small?52:72);if(good){state.stage=1;state.stageValid[0]=true;state.message={kind:'good',text:'Oś narysowana od lewej do prawej — to dobry zwrot!'};beep(true);render()}else builderWrong('Linia musi skończyć się na fioletowym kółku META. Spróbuj jeszcze raz.')});svg.addEventListener('pointercancel',()=>{gesture=null;const line=svg.querySelector('#dragPreview');if(line)line.setAttribute('opacity','0')})}
else if(state.stage===1){svg.addEventListener('click',event=>{const p=coordinates(event,svg);if(p.y<80||p.y>190){state.message={kind:'info',text:'Wybierz miejsce na poziomej linii.'};render();return}const target=g.x0+g.dx;if(Math.abs(p.x-target)<=(g.small?20:34)){state.stage=2;state.stageValid[1]=true;state.message={kind:'good',text:'Brawo! Odcinki mają tę samą długość. Teraz podpisz wybrane kreski.'};beep(true);render()}else builderWrong('Spróbuj podzielić oś na 7 równych części. Druga kreska powinna być blisko lewej strony, ok. 1/7 długości osi.')})}
else if(state.stage===3){svg.addEventListener('click',event=>{const p=coordinates(event,svg);if(p.y<75||p.y>195||p.x<g.x0-g.dx/2||p.x>g.x1+g.dx/2)return;setSelectionTick(Math.round((p.x-g.x0)/g.dx))})}}
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||!root.contains(button))return;const action=button.dataset.action;if(button.dataset.topic){state.topic=button.dataset.topic;render();return}if(button.dataset.count){state.count=Number(button.dataset.count);render();return}if(button.dataset.mode){state.mode=button.dataset.mode;render();return}if(!action)return;
if(action==='voice-start')startSpeechRecognition();else if(action==='voice-stop'){if(activeSpeechRecognizer){state.voice.status='processing';try{activeSpeechRecognizer.stop()}catch(e){stopSpeechRecognition();state.voice={status:'error',transcript:'',value:null,reason:'Nie udało się zakończyć nagrywania.'}}render()}}else if(action==='start')startSession();else if(action==='restart')startSession();else if(action==='repeat'){const qs=state.results.filter(r=>r.errors>0||r.skipped).map(r=>r.q);startSession(qs)}else if(action==='home'){if(state.screen==='play'&&state.results.length>0&&!state.solved&&!confirm('Zakończyć trwającą misję? Postęp tej kartkówki zostanie utracony.'))return;stopSpeechRecognition();state.screen='home';render()}else if(action==='next')advance();else if(action==='hint')showHint();else if(action==='check')answerQuestion();else if(action==='skip'){if(!confirm('Pominąć to zadanie? Otrzymasz 0 gwiazdek, ale zobaczysz rozwiązanie.'))return;finishQuestion(true)}else if(action==='tick-plus')setSelectionTick((state.selectedTick??-1)+1);else if(action==='tick-minus')setSelectionTick((state.selectedTick??1)-1)});
root.addEventListener('submit',event=>{if(event.target.id==='answerForm'){event.preventDefault();answerQuestion()}});
root.addEventListener('input',event=>{if(event.target.id==='theAnswer'){state.draft=event.target.value;if(state.voice.status==='recognized'||state.voice.status==='unparsed')state.voice={status:'idle',transcript:'',value:null,reason:''};}if(event.target.id==='drawStart')state.drawFields.start=event.target.value;if(event.target.id==='drawMiddle')state.drawFields.middle=event.target.value});
document.getElementById('soundBtn').addEventListener('click',()=>{prefs.sound=!prefs.sound;persisted();updateHeader();if(prefs.sound)beep(true)});
document.querySelector('.topbar [data-action="home"]').addEventListener('click',()=>{if(state.screen==='play'&&state.results.length>0&&!state.solved&&!confirm('Przerwać misję i wrócić do startu?'))return;stopSpeechRecognition();state.screen='home';render()});
render();
</script>
</body>
</html>
